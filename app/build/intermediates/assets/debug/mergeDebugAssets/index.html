function heatColor(v, min, max) {
  if (v == null || isNaN(v)) return "#3a3a3a";
  var t = (v - min) / (max - min);
  t = Math.max(0, Math.min(1, t));
  var h = 240 * (1 - t);
  return "hsl(" + h + ",75%,50%)";
}

/* ═══ SOUND SYNTHESIS ═══ */
var _audioCtx = null;
var _noiseBuffer = null;
function getAudioCtx() {
  if (!_audioCtx) {
    try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; }
  }
  if (_audioCtx && _audioCtx.state === "suspended") { try { _audioCtx.resume(); } catch(e){} }
  return _audioCtx;
}
function getNoiseBuffer(ctx) {
  if (_noiseBuffer) return _noiseBuffer;
  var len = ctx.sampleRate * 2;
  _noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
  var d = _noiseBuffer.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return _noiseBuffer;
}

function _bubble(ctx, t, freq, amp) {
  var o = ctx.createOscillator();
  var g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(freq * 2.2, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(60, freq * 0.5), t + 0.08);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(amp, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + 0.14);
}

function playFizz() {
  var ctx = getAudioCtx(); if (!ctx) return;
  var t0 = ctx.currentTime;
  var src = ctx.createBufferSource(); src.buffer = getNoiseBuffer(ctx); src.loop = true;
  var hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1800; hp.Q.value = 0.7;
  var hg = ctx.createGain();
  hg.gain.setValueAtTime(0.0001, t0);
  hg.gain.exponentialRampToValueAtTime(0.05, t0 + 0.08);
  hg.gain.linearRampToValueAtTime(0.04, t0 + 1.4);
  hg.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.0);
  src.connect(hp); hp.connect(hg); hg.connect(ctx.destination);
  src.start(t0); src.stop(t0 + 2.05);
  for (var i = 0; i < 22; i++) {
    var bt = t0 + 0.05 + Math.random() * 1.7;
    var f = 180 + Math.random() * 520;
    _bubble(ctx, bt, f, 0.07 + Math.random() * 0.06);
  }
}

function playExplode() {
  var ctx = getAudioCtx(); if (!ctx) return;
  var t0 = ctx.currentTime;
  var src = ctx.createBufferSource(); src.buffer = getNoiseBuffer(ctx);
  var lp = ctx.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(2400, t0);
  lp.frequency.exponentialRampToValueAtTime(180, t0 + 0.7);
  var ng = ctx.createGain();
  ng.gain.setValueAtTime(0.5, t0);
  ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.85);
  src.connect(lp); lp.connect(ng); ng.connect(ctx.destination);
  src.start(t0); src.stop(t0 + 0.9);

  var o = ctx.createOscillator();
  var og = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(140, t0);
  o.frequency.exponentialRampToValueAtTime(38, t0 + 0.5);
  og.gain.setValueAtTime(0.6, t0);
  og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
  o.connect(og); og.connect(ctx.destination);
  o.start(t0); o.stop(t0 + 0.6);
}

function playWhoosh() {
  var ctx = getAudioCtx(); if (!ctx) return;
  var t0 = ctx.currentTime;
  var src = ctx.createBufferSource(); src.buffer = getNoiseBuffer(ctx);
  var bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.2;
  bp.frequency.setValueAtTime(300, t0);
  bp.frequency.exponentialRampToValueAtTime(1800, t0 + 0.3);
  bp.frequency.exponentialRampToValueAtTime(500, t0 + 0.9);
  var ng = ctx.createGain();
  ng.gain.setValueAtTime(0.0001, t0);
  ng.gain.exponentialRampToValueAtTime(0.2, t0 + 0.15);
  ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.95);
  src.connect(bp); bp.connect(ng); ng.connect(ctx.destination);
  src.start(t0); src.stop(t0 + 1.0);
}

function playPlop() {
  var ctx = getAudioCtx(); if (!ctx) return;
  var t0 = ctx.currentTime;
  var o = ctx.createOscillator();
  var g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(520, t0);
  o.frequency.exponentialRampToValueAtTime(140, t0 + 0.18);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0 + 0.28);
}

function playTick() {
  var ctx = getAudioCtx(); if (!ctx) return;
  var t0 = ctx.currentTime;
  var o = ctx.createOscillator();
  var g = ctx.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(900, t0);
  o.frequency.exponentialRampToValueAtTime(500, t0 + 0.04);
  g.gain.setValueAtTime(0.08, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.06);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0 + 0.07);
}

function playAchievement() {
  var ctx = getAudioCtx(); if (!ctx) return;
  var t0 = ctx.currentTime;
  var notes = [523.25, 659.25, 783.99, 1046.50];
  notes.forEach(function(f, i) {
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = "triangle";
    o.frequency.value = f;
    var st = t0 + i * 0.09;
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(0.12, st + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, st + 0.3);
    o.connect(g); g.connect(ctx.destination);
    o.start(st); o.stop(st + 0.32);
  });
}

function playBeep(type) {
  try {
    triggerHaptic(type);
    if (type === "explode") return playExplode();
    if (type === "whoosh" || type === "combustion") return playWhoosh();
    if (type === "plop" || type === "precip") return playPlop();
    if (type === "achievement") return playAchievement();
    if (type === "fizz") return playFizz();
    return playTick();
  } catch (e) { /* silent */ }
}

function findReaction(b, isHeated) {
  if (b.length !== 2) return null;
  var ids = [b[0].id, b[1].id];
  return RXN.find(function(r) {
    if (r.r.indexOf(ids[0]) === -1 || r.r.indexOf(ids[1]) === -1) return false;
    if (r.needsHeat && !isHeated) return false;
    return true;
  }) || null;
}

function findPotentialReaction(b) {
  if (b.length !== 2) return null;
  var ids = [b[0].id, b[1].id];
  return RXN.find(function(r) {
    return r.r.indexOf(ids[0]) !== -1 && r.r.indexOf(ids[1]) !== -1;
  }) || null;
}

function pHColor(pH) {
  if (pH === null) return "#666";
  if (pH <= 2) return "#ff1744"; if (pH <= 4) return "#ff5722"; if (pH <= 6) return "#ffab00";
  if (pH === 7) return "#76ff03"; if (pH <= 9) return "#00e5ff"; if (pH <= 11) return "#2979ff";
  return "#7c4dff";
}

function pHLabel(pH) {
  if (pH === null) return "N/A";
  if (pH <= 2) return "Strongly Acidic"; if (pH <= 6) return "Acidic";
  if (pH === 7) return "Neutral"; if (pH <= 11) return "Basic";
  return "Strongly Basic";
}

function parseProducts(eq) {
  var rhs = eq.split("->")[1] || "";
  return rhs.split("+").map(function(p) {
    return p.trim().replace(/^\d+\s*/, "").split(/\s+/)[0];
  }).filter(function(p) { return p && p !== "fire" && p !== "heat" && p !== "light" && p !== "lilac" && MOL[p]; });
}

function MoleculeView(props) {

  var T = props.T || themeStyles("dark");
  var mol = MOL[molKey];
  if (!mol) return null;
  var size = 88;
  var cx = size/2, cy = size/2;
  var bondColor = T.isLight ? "#666" : "#aaa";
  var labelColor = T.isLight ? "#fff" : "#111";
  return (
    <div style={{ display:"flex",flexDirection:"column",alignItems:"center" }}>
      <svg width={size} height={size} viewBox={"0 0 "+size+" "+size} style={{ background:"radial-gradient(circle at 50% 40%,rgba(64,196,255,.1),transparent 70%)",borderRadius:10 }}>
        <defs>

              <stop offset="0%" stopColor="#fff" stopOpacity="0.95"/>
              <stop offset="45%" stopColor={ATOM_COLORS[k]} stopOpacity="1"/>
              <stop offset="100%" stopColor={ATOM_COLORS[k]} stopOpacity="0.55"/>
            </radialGradient>;
          })}
        </defs>
        {mol.bonds.map(function(b,i) {
          var a1 = mol.atoms[b[0]], a2 = mol.atoms[b[1]];
          return <line key={"bb"+i} x1={cx+a1[1]} y1={cy+a1[2]} x2={cx+a2[1]} y2={cy+a2[2]} stroke={bondColor} strokeWidth="3" strokeLinecap="round" opacity="0.55"/>;
        })}

            <circle cx={cx+a[1]+1} cy={cy+a[2]+2} r={a[3]} fill="#000" opacity="0.25"/>

/* ═══ THERMOMETER SVG ═══ */
function Thermometer(props) {
  var temp = props.temp;
  var active = props.active;
  var T = props.T || themeStyles("dark");

  var level, color, label;
  if (!active || !temp) { level = 0.4; color = T.isLight ? "#999" : "#666"; label = "--"; }
  else if (temp === "exo") { level = 0.9; color = "#ff5722"; label = "HOT"; }
  else if (temp === "endo") { level = 0.12; color = "#00bcd4"; label = "COLD"; }
  else { level = 0.5; color = "#9e9e9e"; label = "OK"; }

  var fillTop = 84 - level * 60;

  return (
    <svg width="30" height="106" viewBox="0 0 30 106">
      <defs>
        <linearGradient id="thGlass" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor={T.isLight?"rgba(0,0,0,0.05)":"rgba(255,255,255,0.06)"}/>
          <stop offset="50%" stopColor={T.isLight?"rgba(0,0,0,0.12)":"rgba(255,255,255,0.22)"}/>
          <stop offset="100%" stopColor={T.isLight?"rgba(0,0,0,0.05)":"rgba(255,255,255,0.06)"}/>
        </linearGradient>
      </defs>
      <circle cx="15" cy="90" r="9" fill={T.isLight?"rgba(0,0,0,0.05)":"rgba(255,255,255,0.06)"} stroke={T.glassStroke} strokeWidth="1.3"/>
      <circle cx="15" cy="90" r="7" fill={color}>
        {active && <animate attributeName="r" values="7;7.8;7" dur="1.1s" repeatCount="indefinite"/>}
      </circle>
      <rect x="11.5" y="20" width="7" height="68" rx="3.5" fill="url(#thGlass)" stroke={T.glassStroke} strokeWidth="1.3"/>
      <rect x="13" y={fillTop} width="4" height={88-fillTop} fill={color} style={{ transition:"y 1.4s ease-out, height 1.4s ease-out" }}/>
      {[28,40,52,64,76].map(function(y,i) {
        return <line key={i} x1="19" y1={y} x2="23" y2={y} stroke={T.glassStroke} strokeWidth="0.9" opacity="0.7"/>;
      })}
      <text x="15" y="14" textAnchor="middle" fontSize="9" fontWeight="900" fill={color} fontFamily="inherit">{label}</text>
    </svg>
  );
}

/* ═══ PARTICLES HOOK ═══ */
function useParticles() {
  var ref = useRef([]);
  var idRef = useRef(0);
  var [tick, setTick] = useState(0);

  var emit = useCallback(function(color, type, count) {
    for (var i = 0; i < (count||15); i++) {
      ref.current.push({
        id: idRef.current++, x: 45+Math.random()*10, y: 40+Math.random()*20,
        vx: (Math.random()-0.5)*(type==="explode"?10:3),
        vy: type==="explode"?-(Math.random()*10+2):-(Math.random()*4+1),
        sz: Math.random()*6+2, color: color, life: 1
      });
    }
    setTick(function(t){return t+1});
  }, []);

  useEffect(function() {
    if (!ref.current.length) return;
    var timer = setInterval(function() {
      ref.current = ref.current.map(function(p) {
        return { ...p, x:p.x+p.vx*0.25, y:p.y+p.vy*0.25+0.15, vy:p.vy+0.1, life:p.life-0.02, sz:p.sz*0.98 };
      }).filter(function(p) { return p.life > 0; });
      setTick(function(t){return t+1});
    }, 30);
    return function() { clearInterval(timer); };
  }, [tick > 0 ? 1 : 0]);

  return { particles: ref.current, emit: emit };
}

/* ═══ PERIODIC TRENDS GRAPH ═══ */
function TrendsGraph(props) {
  var prop = COLOR_PROPS[props.prop];
  var T = props.T;
  if (!prop || !prop.get) return null;
  var W = 340, H = 200;
  var pad = { l:36, r:10, t:14, b:24 };
  var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;

  var points = EL.map(function(e) { return { n:e.n, v:prop.get(e), cat:e.cat, s:e.s }; })
                 .filter(function(p) { return p.v != null && !isNaN(p.v); });
  if (!points.length) return <div style={{ color:T.textDim, fontSize:13, padding:20 }}>No data</div>;

  var vMin = Math.min.apply(null, points.map(function(p){return p.v}));
  var vMax = Math.max.apply(null, points.map(function(p){return p.v}));
  if (vMin === vMax) vMax = vMin + 1;
  var nMax = 118;

  function px(n) { return pad.l + (n / nMax) * iw; }
  function py(v) { return pad.t + ih - ((v - vMin) / (vMax - vMin)) * ih; }

  var yTicks = [vMin, (vMin+vMax)/2, vMax];
  var fmt = function(v) {
    var a = Math.abs(v);
    if (a >= 1000) return Math.round(v);
    if (a >= 10) return Math.round(v*10)/10;
    return Math.round(v*100)/100;
  };

  var periodStarts = [3,11,19,37,55,87];
  var lineColor = T.isLight ? "#1976d2" : "#40c4ff";

  return (
    <svg width="100%" height={H} viewBox={"0 0 "+W+" "+H} preserveAspectRatio="xMidYMid meet">
      {periodStarts.map(function(s, i) {
        return <line key={"ps"+i} x1={px(s)} y1={pad.t} x2={px(s)} y2={pad.t+ih} stroke={T.headerBorder} strokeWidth="0.5" strokeDasharray="2,3"/>;
      })}
      {yTicks.map(function(v, i) {
        var y = py(v);
        return <g key={"yt"+i}>
          <line x1={pad.l} y1={y} x2={W-pad.r} y2={y} stroke={T.headerBorder} strokeWidth="0.5"/>
          <text x={pad.l-5} y={y+3} fontSize="9" fill={T.textDim} textAnchor="end" fontFamily="inherit">{fmt(v)}</text>
        </g>;
      })}
      {[1,18,36,54,86,118].map(function(n, i) {
        var x = px(n);
        return <g key={"xt"+i}>
          <line x1={x} y1={pad.t+ih} x2={x} y2={pad.t+ih+3} stroke={T.headerBorder} strokeWidth="0.6"/>
          <text x={x} y={pad.t+ih+12} fontSize="9" fill={T.textDim} textAnchor="middle" fontFamily="inherit">{n}</text>
        </g>;
      })}
      <polyline points={points.map(function(p){return px(p.n)+","+py(p.v)}).join(" ")} fill="none" stroke={lineColor} strokeWidth="1" opacity="0.45"/>
      {points.map(function(p, i) {
        return <circle key={"d"+i} cx={px(p.n)} cy={py(p.v)} r="2.4" fill={CC[p.cat]||"#666"} stroke={T.isLight?"#fff":"#0a0e18"} strokeWidth="0.4"/>;
      })}
      <text x={W/2} y={H-2} fontSize="9" fill={T.textDim} textAnchor="middle" fontFamily="inherit">Atomic Number →</text>
      <text x={6} y={pad.t+ih/2} fontSize="9" fill={T.textDim} textAnchor="middle" fontFamily="inherit" transform={"rotate(-90 6 "+(pad.t+ih/2)+")"}>{prop.label}</text>
    </svg>
  );
}

/* ═══ COMPARE VIEW ═══ */
function CompareView(props) {
  var a = props.elements[0];
  var b = props.elements[1];
  var T = props.T;

  function row(label, av, bv, unit) {
    var aNum = (av==null||av==="?"||av==="Ancient")?null:parseFloat(av);
    var bNum = (bv==null||bv==="?"||bv==="Ancient")?null:parseFloat(bv);
    var aBig = aNum!=null && bNum!=null && aNum > bNum;
    var bBig = aNum!=null && bNum!=null && bNum > aNum;
    var aDisp = (av==null||av==="?")?"--":(av+(unit||""));
    var bDisp = (bv==null||bv==="?")?"--":(bv+(unit||""));
    return <div style={{ display:"grid",gridTemplateColumns:"1fr 96px 1fr",gap:5,marginBottom:5,alignItems:"center" }}>
      <div style={{ fontSize:12,fontWeight:700,color:aBig?"#00e676":(bBig?T.textDim:T.text),textAlign:"right" }}>{aDisp}</div>
      <div style={{ fontSize:10,color:T.textDim,textAlign:"center",fontWeight:700,letterSpacing:0.5 }}>{label}</div>
      <div style={{ fontSize:12,fontWeight:700,color:bBig?"#00e676":(aBig?T.textDim:T.text) }}>{bDisp}</div>
    </div>;
  }

  return (
    <div>
      <div style={{ display:"flex",alignItems:"center",marginBottom:14 }}>
        <div style={{ flex:1,textAlign:"center",paddingRight:6 }}>
          <div style={{ fontSize:12,color:T.textDim }}>#{a.n}</div>
          <div style={{ fontSize:34,fontWeight:900,color:CC[a.cat],lineHeight:1 }}>{a.s}</div>
          <div style={{ fontSize:14,color:T.text,marginTop:2 }}>{a.name}</div>
          <div style={{ fontSize:10,padding:"2px 6px",borderRadius:4,display:"inline-block",marginTop:4,background:(CC[a.cat]||"#666")+"22",color:CC[a.cat],border:"1px solid "+(CC[a.cat]||"#666")+"44" }}>{a.cat}</div>
        </div>
        <div style={{ fontSize:17,color:T.textDim,fontWeight:700,padding:"0 4px" }}>VS</div>
        <div style={{ flex:1,textAlign:"center",paddingLeft:6 }}>
          <div style={{ fontSize:12,color:T.textDim }}>#{b.n}</div>
          <div style={{ fontSize:34,fontWeight:900,color:CC[b.cat],lineHeight:1 }}>{b.s}</div>
          <div style={{ fontSize:14,color:T.text,marginTop:2 }}>{b.name}</div>
          <div style={{ fontSize:10,padding:"2px 6px",borderRadius:4,display:"inline-block",marginTop:4,background:(CC[b.cat]||"#666")+"22",color:CC[b.cat],border:"1px solid "+(CC[b.cat]||"#666")+"44" }}>{b.cat}</div>
        </div>
      </div>
      <div style={{ background:T.surfaceAlt,borderRadius:7,padding:8 }}>
        {row("Atomic Mass", a.m, b.m, " u")}
        {row("Group / Period", a.col+"/"+a.row, b.col+"/"+b.row, "")}
        {row("Electronegativity", a.en, b.en, "")}
        {row("Atomic Radius", a.ar, b.ar, " pm")}
        {row("Ionization E.", a.ie, b.ie, " kJ/mol")}
        {row("Melting Pt", a.mp!=null&&a.mp!==-1?a.mp:null, b.mp!=null&&b.mp!==-1?b.mp:null, "°C")}
        {row("Boiling Pt", a.bp!=null&&a.bp!==-1?a.bp:null, b.bp!=null&&b.bp!==-1?b.bp:null, "°C")}
        {row("Density", a.d, b.d, " g/cm³")}
        {row("Discovered", a.disc===-1?"Ancient":String(a.disc), b.disc===-1?"Ancient":String(b.disc), "")}
      </div>
    </div>
  );
}

/* ═══ PERIODIC TABLE VIEW ═══ */
function PTView(props) {
  var T = props.T || themeStyles("dark");
  var [sel, setSel] = useState(null);
  var [search, setSearch] = useState("");
  var [catF, setCatF] = useState(null);
  var [colorMode, setColorMode] = useState("category");
  var [compareMode, setCompareMode] = useState(false);
  var [compare, setCompare] = useState([]);
  var [showCompare, setShowCompare] = useState(false);
  var [showTrends, setShowTrends] = useState(false);
  var [trendProp, setTrendProp] = useState("en");

  var selRef = useRef(sel);
  var showCompareRef = useRef(showCompare);
  var showTrendsRef = useRef(showTrends);
  var compareModeRef = useRef(compareMode);
  var compareLenRef = useRef(compare.length);
  var catFRef = useRef(catF);
  var searchRef = useRef(search);
  useEffect(function() { selRef.current = sel; }, [sel]);
  useEffect(function() { showCompareRef.current = showCompare; }, [showCompare]);
  useEffect(function() { showTrendsRef.current = showTrends; }, [showTrends]);
  useEffect(function() { compareModeRef.current = compareMode; }, [compareMode]);
  useEffect(function() { compareLenRef.current = compare.length; }, [compare.length]);
  useEffect(function() { catFRef.current = catF; }, [catF]);
  useEffect(function() { searchRef.current = search; }, [search]);

  useEffect(function() {
    return window.pushBackHandler(function() {
      if (showTrendsRef.current) { setShowTrends(false); return true; }
      if (showCompareRef.current) { setShowCompare(false); return true; }
      if (selRef.current) { setSel(null); return true; }
      if (compareModeRef.current && compareLenRef.current > 0) { setCompare([]); return true; }
      if (compareModeRef.current) { setCompareMode(false); return true; }
      if (catFRef.current) { setCatF(null); return true; }
      if (searchRef.current) { setSearch(""); return true; }
      return false;
    });
  }, []);

  var highlighted = null;
  if (search) {
    var s = search.toLowerCase();
    highlighted = {};
    EL.forEach(function(e) { if (e.name.toLowerCase().indexOf(s)!==-1 || e.s.toLowerCase().indexOf(s)!==-1 || String(e.n)===search) highlighted[e.n]=true; });
  } else if (catF) {
    highlighted = {};
    EL.forEach(function(e) { if (e.cat === catF) highlighted[e.n] = true; });
  }

  function getColor(el) {
    if (colorMode === "category") return CC[el.cat] || "#666";
    var prop = COLOR_PROPS[colorMode];
    if (!prop || !prop.get) return CC[el.cat] || "#666";
    return heatColor(prop.get(el), prop.min, prop.max);
  }

  function handleClick(el) {
    playBeep("tick");
    if (compareMode) {
      setCompare(function(prev) {
        if (prev.find(function(p){return p.n===el.n})) return prev.filter(function(p){return p.n!==el.n});
        if (prev.length >= 2) return [prev[1], el];
        var next = prev.concat(el);
        if (next.length === 2) setTimeout(function(){setShowCompare(true)}, 150);
        return next;
      });
    } else {
      setSel(el);
    }
  }

  var compareIds = {};
  compare.forEach(function(e){compareIds[e.n]=true});

  var cells = [];
  for (var row = 1; row <= 10; row++) {
    for (var col = 1; col <= 18; col++) {
      if (row === 6 && col === 3) {
        cells.push({ key: row+"-"+col, marker: "La-Lu", cat: "Lanthanide" });
      } else if (row === 7 && col === 3) {
        cells.push({ key: row+"-"+col, marker: "Ac-Lr", cat: "Actinide" });
      } else {
        var el = null;
        for (var i = 0; i < EL.length; i++) { if (EL[i].row === row && EL[i].col === col) { el = EL[i]; break; } }
        cells.push({ key: row+"-"+col, el: el });
      }
    }
  }

  var activeProp = COLOR_PROPS[colorMode];

  return (
    <div style={{ padding: "10px 8px", paddingBottom: 30 }}>
      <input value={search} onChange={function(e){setSearch(e.target.value)}} placeholder="Search element by name, symbol, or #..." style={{ width:"100%",padding:"8px 12px",borderRadius:8,border:"1px solid "+T.headerBorder,background:T.surfaceAlt,color:T.text,fontSize:14,fontFamily:"inherit",outline:"none",marginBottom:6 }} />

      <div style={{ display:"flex",gap:4,marginBottom:6 }}>
        <button onClick={function(){setCompareMode(!compareMode);if(compareMode)setCompare([])}} style={{ flex:1,padding:"6px 6px",borderRadius:6,fontSize:11,fontWeight:700,fontFamily:"inherit",cursor:"pointer",background:compareMode?"rgba(0,230,118,.12)":T.surfaceAlt,border:"1px solid "+(compareMode?"rgba(0,230,118,.4)":T.headerBorder),color:compareMode?"#00e676":T.textDim }}>{compareMode?"⚖ COMPARE ("+compare.length+"/2)":"⚖ Compare"}</button>
        <button onClick={function(){setShowTrends(true)}} style={{ flex:1,padding:"6px 6px",borderRadius:6,fontSize:11,fontWeight:700,fontFamily:"inherit",cursor:"pointer",background:T.surfaceAlt,border:"1px solid "+T.headerBorder,color:"#40c4ff" }}>📈 Trends</button>
        {compareMode && compare.length>0 && <button onClick={function(){setCompare([])}} style={{ padding:"6px 8px",borderRadius:6,fontSize:11,fontWeight:700,fontFamily:"inherit",cursor:"pointer",background:"rgba(255,80,80,.08)",border:"1px solid rgba(255,80,80,.25)",color:"#ef5350" }}>Clear</button>}
      </div>

      <div style={{ display:"flex",alignItems:"center",gap:4,marginBottom:6,flexWrap:"wrap" }}>
        <span style={{ fontSize:12,color:T.textDim,fontWeight:800,letterSpacing:0.5 }}>SCALE:</span>
        {Object.keys(COLOR_PROPS).map(function(k) {

/* ═══ MOLAR MASS CALCULATOR COMPONENT ═══ */
function parseChemicalFormula(formula) {
  formula = (formula || "").trim().replace(/\s+/g, "");
  if (!formula) return null;
  var parts = formula.split(/[\.·\*]/);
  var counts = {};

  function parsePart(str, multiplier) {
    multiplier = multiplier || 1;
    var stack = [{}];
    var i = 0;
    while (i < str.length) {
      var ch = str[i];
      if (ch === '(' || ch === '[') {
        stack.push({});
        i++;
      } else if (ch === ')' || ch === ']') {
        i++;
        var numStr = "";
        while (i < str.length && /\d/.test(str[i])) {
          numStr += str[i];
          i++;
        }
        var groupMult = numStr ? parseInt(numStr, 10) : 1;
        var top = stack.pop();
        var current = stack[stack.length - 1];
        if (top) {
          for (var el in top) {
            current[el] = (current[el] || 0) + top[el] * groupMult;
          }
        }
      } else if (/[A-Z]/.test(ch)) {
        var elName = ch;
        i++;
        if (i < str.length && /[a-z]/.test(str[i])) {
          elName += str[i];
          i++;
        }
        var countStr = "";
        while (i < str.length && /\d/.test(str[i])) {
          countStr += str[i];
          i++;
        }
        var elCount = countStr ? parseInt(countStr, 10) : 1;
        var cur = stack[stack.length - 1];
        cur[elName] = (cur[elName] || 0) + elCount;
      } else {
        i++;
      }
    }
    var res = stack[0];
    for (var k in res) {
      counts[k] = (counts[k] || 0) + res[k] * multiplier;
    }
  }

  var m0 = parts[0].match(/^(\d+)(.*)/);
  if (m0) {
    parsePart(m0[2], parseInt(m0[1], 10));
  } else {
    parsePart(parts[0], 1);
  }

  for (var p = 1; p < parts.length; p++) {
    var mp = parts[p].match(/^(\d+)?(.*)/);
    if (mp) {
      var mult = mp[1] ? parseInt(mp[1], 10) : 1;
      parsePart(mp[2] || "H2O", mult);
    }
  }

  var massMap = {};
  EL.forEach(function(e) { massMap[e.s] = e; });

  var totalMass = 0;
  var breakdown = [];
  for (var symb in counts) {
    var elInfo = massMap[symb];
    if (!elInfo) return { error: "Unknown element: " + symb };
    var elemTotalMass = counts[symb] * elInfo.m;
    totalMass += elemTotalMass;
    breakdown.push({
      symbol: symb,
      name: elInfo.name,
      cat: elInfo.cat,
      count: counts[symb],
      singleMass: elInfo.m,
      totalElemMass: elemTotalMass
    });
  }

  if (totalMass === 0) return null;

  breakdown.forEach(function(b) {
    b.percent = (b.totalElemMass / totalMass) * 100;
  });

  breakdown.sort(function(a, b) { return b.totalElemMass - a.totalElemMass; });

  return {
    formula: formula,
    totalMass: totalMass,
    breakdown: breakdown
  };
}

function MolarMassCalc(props) {
  var T = props.T;
  var [formula, setFormula] = useState("H2SO4");
  var presets = ["H2O","NaCl","H2SO4","Ca(OH)2","CaCO3","C6H12O6","KMnO4","(NH4)2SO4","CuSO4*5H2O","NaHCO3"];

  var result = useMemo(function() {
    return parseChemicalFormula(formula);
  }, [formula]);

  return (
    <div style={{ padding:14,maxWidth:420,margin:"0 auto" }}>
      <div style={{ textAlign:"center",marginBottom:12 }}>
        <h2 style={{ fontSize:18,fontWeight:900,color:"#00e676",letterSpacing:1 }}>⚖️ MOLAR MASS CALCULATOR</h2>
        <p style={{ fontSize:11,color:T.textDim,marginTop:2 }}>Enter any chemical formula or hydrate to calculate molecular weight and mass percent.</p>
      </div>

      <div style={{ display:"flex",gap:6,marginBottom:10 }}>
        <input
          value={formula}
          onChange={function(e){setFormula(e.target.value)}}
          placeholder="e.g. H2SO4, Ca(OH)2..."
          style={{ flex:1,padding:"10px 14px",fontSize:16,fontWeight:700,borderRadius:8,border:"1px solid "+T.headerBorder,background:T.surfaceAlt,color:T.text,fontFamily:"inherit",outline:"none" }}
        />
        {formula && <button onClick={function(){setFormula("")}} style={{ padding:"8px 12px",borderRadius:8,border:"1px solid "+T.headerBorder,background:T.surfaceAlt,color:T.textDim,fontSize:14,cursor:"pointer" }}>Clear</button>}
      </div>

      <div style={{ display:"flex",gap:4,flexWrap:"wrap",marginBottom:14 }}>
        {presets.map(function(p) {
          return <button key={p} onClick={function(){setFormula(p);playBeep("tick");}} style={{ padding:"4px 8px",borderRadius:6,fontSize:11,fontWeight:700,fontFamily:"inherit",background:formula===p?"rgba(0,230,118,.15)":T.surfaceAlt,border:"1px solid "+(formula===p?"#00e676":T.borderSoft),color:formula===p?"#00e676":T.textDim,cursor:"pointer" }}>{p}</button>;
        })}
      </div>

      {result && result.error && (
        <div style={{ padding:10,borderRadius:8,background:"rgba(255,80,80,.1)",border:"1px solid rgba(255,80,80,.3)",color:"#ef5350",fontSize:13,textAlign:"center" }}>
          {result.error}
        </div>
      )}

      {result && !result.error && (
        <div style={{ background:T.surfaceAlt,borderRadius:12,border:"1px solid "+T.headerBorder,padding:14 }}>
          <div style={{ textAlign:"center",paddingBottom:12,borderBottom:"1px solid "+T.borderSoft }}>
            <div style={{ fontSize:12,color:T.textDim,letterSpacing:1 }}>TOTAL MOLAR MASS</div>
            <div style={{ fontSize:32,fontWeight:900,color:"#00e676",margin:"4px 0" }}>{result.totalMass.toFixed(3)} <span style={{ fontSize:16,color:T.textDim }}>g/mol</span></div>
            <div style={{ fontSize:13,color:T.text,fontWeight:600 }}>{result.formula}</div>
          </div>

          {/* Mass Percentage Stacked Bar */}
          <div style={{ margin:"14px 0 8px" }}>
            <div style={{ fontSize:11,color:T.textDim,fontWeight:700,marginBottom:4 }}>MASS PERCENTAGE COMPOSITION</div>
            <div style={{ display:"flex",height:14,borderRadius:7,overflow:"hidden",boxShadow:"inset 0 1px 3px rgba(0,0,0,.3)" }}>
              {result.breakdown.map(function(item) {
                var c = CC[item.cat] || "#29b6f6";
                return <div key={item.symbol} title={item.symbol+": "+item.percent.toFixed(1)+"%"} style={{ width:item.percent+"%",background:c,minWidth:item.percent>0?4:0 }} />;
              })}
            </div>
          </div>

          <div style={{ marginTop:10 }}>
            {result.breakdown.map(function(item) {
              var c = CC[item.cat] || "#29b6f6";
              return (
                <div key={item.symbol} style={{ display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid "+T.borderSoft }}>
                  <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                    <div style={{ width:24,height:24,borderRadius:4,background:c+"22",color:c,border:"1px solid "+c+"55",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:900 }}>{item.symbol}</div>
                    <div>
                      <div style={{ fontSize:12,fontWeight:700,color:T.text }}>{item.name} <span style={{ fontSize:10,color:T.textDim }}>×{item.count}</span></div>
                      <div style={{ fontSize:10,color:T.textDim }}>{item.singleMass.toFixed(3)} u</div>
                    </div>
                  </div>
                  <div style={{ textAlign:"right" }}>
                    <div style={{ fontSize:13,fontWeight:800,color:c }}>{item.percent.toFixed(2)}%</div>
                    <div style={{ fontSize:10,color:T.textDim }}>{item.totalElemMass.toFixed(2)} g/mol</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function QuizView(props) {
  var T = props.T;
  var [qIndex, setQIndex] = useState(0);
  var [selected, setSelected] = useState(null);
  var [score, setScore] = useState(0);
  var [streak, setStreak] = useState(0);
  var [finished, setFinished] = useState(false);

  var currentQ = QUIZ_QUESTIONS[qIndex];

  function handleSelect(i) {
    if (selected !== null) return;
    setSelected(i);
    var correct = i === currentQ.a;
    if (correct) {
      setScore(function(s){return s+1});
      setStreak(function(st){return st+1});
      playBeep("achievement");
    } else {
      setStreak(0);
      playBeep("explode");
    }
  }

  function handleNext() {
    if (qIndex + 1 < 10) {
      setQIndex(qIndex + 1);
      setSelected(null);
      playBeep("tick");
    } else {
      setFinished(true);
      maybeShowInterstitial(true);
    }
  }

  function restartQuiz() {
    setQIndex(0);
    setSelected(null);
    setScore(0);
    setStreak(0);
    setFinished(false);
    playBeep("tick");
  }

  if (finished) {
    return (
      <div style={{ padding:20,maxWidth:380,margin:"0 auto",textAlign:"center" }}>
        <div style={{ fontSize:54,marginBottom:8 }}>{score >= 8 ? "🏆" : score >= 5 ? "🎓" : "🧪"}</div>
        <h2 style={{ fontSize:22,fontWeight:900,color:"#00e676" }}>QUIZ COMPLETE!</h2>
        <div style={{ fontSize:36,fontWeight:900,color:T.text,margin:"12px 0" }}>{score} / 10</div>
        <p style={{ fontSize:13,color:T.textDim,marginBottom:20 }}>
          {score === 10 ? "Flawless! True Chemistry Grand Master!" : score >= 7 ? "Great job! Strong lab knowledge!" : "Keep practicing and experimenting in the lab!"}
        </p>
        <button onClick={restartQuiz} style={{ width:"100%",padding:"12px",borderRadius:10,background:"linear-gradient(135deg,#00e676,#00b248)",border:"none",color:"#000",fontSize:15,fontWeight:900,cursor:"pointer",fontFamily:"inherit" }}>PLAY AGAIN</button>
      </div>
    );
  }

  return (
    <div style={{ padding:14,maxWidth:420,margin:"0 auto" }}>
      <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12 }}>
        <div style={{ fontSize:12,color:T.textDim,fontWeight:700 }}>QUESTION {qIndex+1} / 10</div>
        <div style={{ display:"flex",gap:10 }}>
          <span style={{ fontSize:12,color:"#ffd700",fontWeight:800 }}>⚡ Streak: {streak}</span>
          <span style={{ fontSize:12,color:"#00e676",fontWeight:800 }}>Score: {score}</span>
        </div>
      </div>

      <div style={{ height:5,borderRadius:3,background:T.surfaceAlt,marginBottom:16,overflow:"hidden" }}>
        <div style={{ height:"100%",background:"linear-gradient(90deg,#00e676,#40c4ff)",width:((qIndex+1)/10*100)+"%" }}/>
      </div>

      <div style={{ background:T.surfaceAlt,border:"1px solid "+T.headerBorder,borderRadius:12,padding:16,marginBottom:14 }}>
        <h3 style={{ fontSize:15,color:T.text,lineHeight:1.4,fontWeight:700 }}>{currentQ.q}</h3>
      </div>

      <div style={{ display:"flex",flexDirection:"column",gap:8,marginBottom:14 }}>
        {currentQ.opts.map(function(opt, idx) {
          var isChosen = selected === idx;
          var isAnswer = idx === currentQ.a;
          var bg = T.surfaceAlt;
          var brd = T.borderSoft;
          var txt = T.text;

          if (selected !== null) {
            if (isAnswer) {
              bg = "rgba(0,230,118,.15)";
              brd = "#00e676";
              txt = "#00e676";
            } else if (isChosen && !isAnswer) {
              bg = "rgba(255,80,80,.15)";
              brd = "#ef5350";
              txt = "#ef5350";
            }
          }

          return (
            <button
              key={idx}
              onClick={function(){handleSelect(idx)}}
              disabled={selected !== null}
              style={{
                padding:"12px 14px",borderRadius:10,background:bg,border:"1.5px solid "+brd,color:txt,
                fontSize:13,fontWeight:700,textAlign:"left",cursor:selected===null?"pointer":"default",
                fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"space-between"
              }}
            >
              <span>{opt}</span>
              {selected !== null && isAnswer && <span>✓</span>}
              {selected !== null && isChosen && !isAnswer && <span>✗</span>}
            </button>
          );
        })}
      </div>

      {selected !== null && (
        <div style={{ background:"rgba(64,196,255,.08)",border:"1px solid rgba(64,196,255,.25)",borderRadius:10,padding:12,marginBottom:14 }}>
          <div style={{ fontSize:11,fontWeight:800,color:"#40c4ff",marginBottom:3 }}>EXPLANATION</div>
          <div style={{ fontSize:12,color:T.text,lineHeight:1.4 }}>{currentQ.exp}</div>
        </div>
      )}

      {selected !== null && (
        <button onClick={handleNext} style={{ width:"100%",padding:12,borderRadius:10,background:"linear-gradient(135deg,#00e676,#00b248)",border:"none",color:"#000",fontSize:14,fontWeight:900,cursor:"pointer",fontFamily:"inherit" }}>
          {qIndex + 1 < 10 ? "NEXT QUESTION →" : "SEE FINAL RESULTS"}
        </button>
      )}
    </div>
  );
}

/* ═══ MAIN LAB CRAFT COMPONENT ═══ */
function LabCraft(props) {
  var theme = props.theme || "dark";
  var setTheme = props.setTheme || function(){};
  var T = themeStyles(theme);

  // Persistent storage loaders
  var [log, setLog] = useState(function() {
    try {
      var saved = localStorage.getItem("labcraft_v2_log");
      return saved ? JSON.parse(saved) : [];
    } catch(e) { return []; }
  });
  var [cDone, setCDone] = useState(function() {
    try {
      var saved = localStorage.getItem("labcraft_v2_cdone");
      return saved ? JSON.parse(saved) : [];
    } catch(e) { return []; }
  });
  var [timedBest, setTimedBest] = useState(function() {
    try {
      var saved = localStorage.getItem("labcraft_v2_timed_best");
      return saved ? parseInt(saved, 10) : null;
    } catch(e) { return null; }
  });
  var [soundOn, setSoundOn] = useState(function() {
    try {
      var saved = localStorage.getItem("labcraft_v2_sound");
      return saved !== null ? JSON.parse(saved) : true;
    } catch(e) { return true; }
  });

  // Ephemeral state
  var [bench, setBench] = useState([]);
  var [result, setResult] = useState(null);
  var [running, setRunning] = useState(false);
  var [done, setDone] = useState(false);
  var [filter, setFilter] = useState("All");
  var [heat, setHeat] = useState(false);
  var [tab, setTab] = useState("lab");
  var [newAch, setNewAch] = useState(null);
  var [timedActive, setTimedActive] = useState(false);
  var [timedTime, setTimedTime] = useState(60);
  var [timedFound, setTimedFound] = useState([]);
  var [viewLogItem, setViewLogItem] = useState(null);
  var [logFilter, setLogFilter] = useState("all");
  var prevAchCount = useRef(0);

  // Auto-save effects
  useEffect(function() {
    try { localStorage.setItem("labcraft_v2_log", JSON.stringify(log)); } catch(e){}
  }, [log]);
  useEffect(function() {
    try { localStorage.setItem("labcraft_v2_cdone", JSON.stringify(cDone)); } catch(e){}
  }, [cDone]);
  useEffect(function() {
    try { if (timedBest !== null) localStorage.setItem("labcraft_v2_timed_best", String(timedBest)); } catch(e){}
  }, [timedBest]);
  useEffect(function() {
    try { localStorage.setItem("labcraft_v2_sound", JSON.stringify(soundOn)); } catch(e){}
  }, [soundOn]);

  var { particles, emit } = useParticles();
  var reaction = findReaction(bench, heat);
  var potentialReaction = findPotentialReaction(bench);
  var filtered = filter === "All" ? ITEMS : ITEMS.filter(function(i){return i.tag===filter});

  // Back handler refs
  var tabRef = useRef(tab);
  var benchRef = useRef(bench);
  var resultRef = useRef(result);
  var viewLogItemRef = useRef(viewLogItem);
  useEffect(function() { tabRef.current = tab; }, [tab]);
  useEffect(function() { benchRef.current = bench; }, [bench]);
  useEffect(function() { resultRef.current = result; }, [result]);
  useEffect(function() { viewLogItemRef.current = viewLogItem; }, [viewLogItem]);

  useEffect(function() {
    return window.pushBackHandler(function() {
      if (viewLogItemRef.current) { setViewLogItem(null); return true; }
      if (tabRef.current !== "lab") { setTab("lab"); return true; }
      if (resultRef.current) { clearAll(); return true; }
      if (benchRef.current.length > 0) { clearAll(); return true; }
      return false;
    });
  }, []);

  var totalScore = log.reduce(function(sum, key) {
    var r = RXN.find(function(x){return x.r.slice().sort().join("+")===key});
    return sum + (r ? r.score : 0);
  }, 0);

  var earnedAch = ACHIEVEMENTS.filter(function(a){return a.check(log)});

  useEffect(function() {
    if (earnedAch.length > prevAchCount.current && prevAchCount.current > 0) {
      var newest = earnedAch[earnedAch.length - 1];
      setNewAch(newest);
      if (soundOn) playBeep("achievement");
      setTimeout(function(){setNewAch(null)}, 3000);
    }
    prevAchCount.current = earnedAch.length;
  });

  useEffect(function() {
    if (!timedActive) return;
    if (timedTime <= 0) {
      setTimedActive(false);
      if (!timedBest || timedFound.length > timedBest) setTimedBest(timedFound.length);
      maybeShowInterstitial(true);
      return;
    }
    var t = setTimeout(function(){setTimedTime(function(v){return v-1})}, 1000);
    return function(){clearTimeout(t)};
  }, [timedActive, timedTime]);

  var hints = bench.length === 1 ? RXN.filter(function(r){return r.r.indexOf(bench[0].id)!==-1}).map(function(r){return r.r[0]===bench[0].id?r.r[1]:r.r[0]}) : [];

  function addItem(item) {
    if (bench.length >= 2 || bench.find(function(b){return b.id===item.id})) return;
    setBench(function(p){return p.concat(item)});
    setResult(null); setDone(false);
    if (soundOn) playBeep("tick");
  }

  function removeItem(id) {
    setBench(function(p){return p.filter(function(b){return b.id!==id})});
    setResult(null); setDone(false);
  }

  function clearAll() { setBench([]); setResult(null); setDone(false); setRunning(false); }

  function runExperiment() {
    if (!reaction || running) return;
    var rxn = reaction;
    setRunning(true); setResult(null); setDone(false);
    var boom = rxn.anim === "explode";
    if (soundOn) {
      var snd = "fizz";
      if (boom && rxn.type === "combustion") snd = "whoosh";
      else if (boom) snd = "explode";
      else if (rxn.type === "precipitation") snd = "plop";
      else if (rxn.type === "combustion") snd = "whoosh";
      playBeep(snd);
      if (boom) setTimeout(function(){ playBeep("fizz"); }, 120);
    }
    emit(rxn.color, rxn.anim, boom ? 30 : 15);
    if (boom) {
      setTimeout(function(){emit("#ff6600","explode",12)}, 350);
      setTimeout(function(){emit("#ffcc00","explode",10)}, 650);
    }
    setTimeout(function() {
      setRunning(false); setDone(true); setResult(rxn);
      var key = rxn.r.slice().sort().join("+");
      var isNew = log.indexOf(key) === -1;
      setLog(function(prev){return prev.indexOf(key)!==-1?prev:prev.concat(key)});
      var mc = CHALLENGES.filter(function(ch){return ch.target===key}).map(function(ch){return ch.id});
      if (mc.length) setCDone(function(prev){var n=prev.slice();mc.forEach(function(id){if(n.indexOf(id)===-1)n.push(id)});return n});
      if (timedActive) setTimedFound(function(prev){return prev.indexOf(key)!==-1?prev:prev.concat(key)});
      if (isNew) maybeShowInterstitial(false);
    }, 2200);
  }

  function startTimed() { setTimedActive(true); setTimedTime(60); setTimedFound([]); clearAll(); }

  function resetProgress() {
    if (window.confirm("Are you sure you want to reset all discovered reactions and progress?")) {
      setLog([]);
      setCDone([]);
      setTimedBest(null);
      localStorage.removeItem("labcraft_v2_log");
      localStorage.removeItem("labcraft_v2_cdone");
      localStorage.removeItem("labcraft_v2_timed_best");
      playBeep("tick");
    }
  }

  var rxnCount = function(id){return RXN.filter(function(r){return r.r.indexOf(id)!==-1}).length};
  var B = function(p) {
    return {padding:p||"3px 8px",borderRadius:5,fontSize:12,fontFamily:"inherit",cursor:"pointer",border:"1px solid rgba(255,255,255,.08)"};
  };

  return (
    <div style={{ minHeight:"100vh",background:T.bg,fontFamily:"'SF Mono','Fira Code','Courier New',monospace",color:T.text,paddingBottom:40 }}>
      {newAch && <div style={{ position:"fixed",top:60,left:"50%",transform:"translateX(-50%)",zIndex:200,background:"linear-gradient(135deg,rgba(255,215,0,.18),rgba(255,215,0,.06))",border:"1px solid rgba(255,215,0,.4)",borderRadius:12,padding:"10px 20px",display:"flex",alignItems:"center",gap:10,animation:"slideDown .4s ease-out",backdropFilter:"blur(10px)" }}>
        <span style={{ fontSize:28 }}>{newAch.icon}</span>
        <div><div style={{ fontSize:14,fontWeight:800,color:"#ffd700" }}>Achievement Unlocked!</div><div style={{ fontSize:13,color:T.text }}>{newAch.title}</div></div>
      </div>}

      <header style={{ display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 14px",borderBottom:"1px solid "+T.headerBorder,background:T.headerBg,position:"sticky",top:0,zIndex:20,backdropFilter:"blur(12px)" }}>
        <div style={{ display:"flex",alignItems:"center",gap:8 }}>
          <span style={{ fontSize:22 }}>{"🧪"}</span>
          <div>
            <h1 style={{ fontSize:17,fontWeight:900,margin:0,background:"linear-gradient(90deg,#00e676,#40c4ff)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent" }}>Lab Craft</h1>
            <p style={{ fontSize:10,color:T.textDim,margin:0 }}>{log.length}/{RXN.length} found • {totalScore} pts • {earnedAch.length} badges</p>
          </div>
        </div>
        <div style={{ display:"flex",gap:4 }}>
          <button onClick={function(){setTheme(theme==="dark"?"light":"dark")}} title="Toggle theme" style={{ ...B(),color:T.isLight?"#ff9100":"#ffd54f",background:T.isLight?"rgba(255,145,0,.08)":"rgba(255,213,79,.08)",borderColor:T.isLight?"rgba(255,145,0,.25)":"rgba(255,213,79,.25)" }}>{T.isLight?"☀":"🌙"}</button>
          <button onClick={function(){setSoundOn(!soundOn)}} style={{ ...B(),color:soundOn?"#00e676":T.textDim,background:soundOn?"rgba(0,230,118,.08)":T.surfaceAlt }}>{soundOn?"ON":"OFF"}</button>
          <button onClick={clearAll} style={{ ...B(),color:"#ef5350",borderColor:"rgba(255,80,80,.2)",background:"rgba(255,80,80,.08)" }}>Clear</button>
        </div>
      </header>

      {timedActive && <div style={{ background:"linear-gradient(90deg,rgba(255,23,68,.1),rgba(255,215,0,.1))",borderBottom:"1px solid rgba(255,215,0,.2)",padding:"6px 14px",display:"flex",alignItems:"center",justifyContent:"space-between" }}>
        <div style={{ fontSize:13,fontWeight:700,color:"#ffd700" }}>TIMED CHALLENGE: {timedTime}s • {timedFound.length} found</div>
        <button onClick={function(){setTimedActive(false);if(!timedBest||timedFound.length>timedBest)setTimedBest(timedFound.length)}} style={{ ...B(),color:"#ef5350",borderColor:"rgba(255,80,80,.3)",background:"rgba(255,80,80,.1)" }}>Stop</button>
      </div>}

      <div style={{ display:"flex",borderBottom:"1px solid "+T.headerBorder,overflowX:"auto" }}>
        {[
          ["lab","Lab"],
          ["periodic","Table"],
          ["calc","Calc"],
          ["quiz","Quiz"],
          ["log","Log "+log.length],
          ["challenge","Quests "+cDone.length],
          ["badges","Badges "+earnedAch.length],
          ["stats","Stats"]
        ].map(function(pair) {
          return <button key={pair[0]} onClick={function(){setTab(pair[0]);playBeep("tick");}} style={{ flex:1,padding:"11px 8px",fontSize:13,fontWeight:700,fontFamily:"inherit",cursor:"pointer",border:"none",borderBottom:tab===pair[0]?"2px solid #00e676":"2px solid transparent",background:"transparent",color:tab===pair[0]?"#00e676":T.textDim,whiteSpace:"nowrap",minWidth:0 }}>{pair[1]}</button>;
        })}
      </div>

      {tab === "periodic" && <PTView T={T}/>}
      {tab === "calc" && <MolarMassCalc T={T}/>}
      {tab === "quiz" && <QuizView T={T}/>}

      {tab === "lab" && <div>
        <div style={{ display:"flex",gap:3,padding:"6px 14px 2px",overflowX:"auto" }}>
          {LTAGS.map(function(t){return <button key={t} onClick={function(){setFilter(t)}} style={{ padding:"6px 12px",borderRadius:16,fontSize:12,fontWeight:700,fontFamily:"inherit",cursor:"pointer",whiteSpace:"nowrap",background:filter===t?"rgba(0,230,118,.14)":T.surfaceAlt,border:"1px solid "+(filter===t?"rgba(0,230,118,.4)":T.borderSoft),color:filter===t?"#00e676":T.textDim }}>{t}</button>})}
        </div>
        <div style={{ padding:"3px 14px 0" }}>
          <div style={{ display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4 }}>
            {filtered.map(function(item) {
              var onB = !!bench.find(function(b){return b.id===item.id});
              var isH = hints.indexOf(item.id) !== -1;
              return <button key={item.id} onClick={function(){addItem(item)}} disabled={onB||bench.length>=2} style={{ background:isH?"rgba(0,230,118,.1)":onB?"rgba(0,230,118,.06)":"rgba(255,255,255,.02)",border:"1.5px solid "+(isH?"#00e67666":onB?"#00e67633":"rgba(255,255,255,.04)"),borderRadius:8,padding:"5px 2px",display:"flex",flexDirection:"column",alignItems:"center",gap:1,fontFamily:"inherit",opacity:onB?0.3:bench.length>=2&&!isH?0.4:1,cursor:onB||bench.length>=2?"default":"pointer",animation:isH?"hintPulse 1.5s infinite":"none" }}>
                <span style={{ fontSize:16 }}>{item.icon}</span>
                <span style={{ fontSize:11,fontWeight:700,color:item.color }}>{item.name}</span>
                <span style={{ fontSize:9,color:T.textMute }}>{rxnCount(item.id)}</span>
                {isH && <span style={{ fontSize:8,color:"#00e676" }}>{"✓"}</span>}
              </button>;
            })}
          </div>
        </div>

        <div style={{ display:"flex",justifyContent:"center",gap:8,padding:"6px 14px 0" }}>
          <button
            onClick={function(){
              setHeat(!heat);
              playBeep(heat ? "tick" : "whoosh");
            }}
            style={{
              padding:"5px 12px",borderRadius:14,fontSize:11,fontWeight:700,fontFamily:"inherit",cursor:"pointer",
              background:heat?"rgba(255,106,0,.18)":"rgba(255,255,255,.02)",
              border:"1.5px solid "+(heat?"#ff6a00":"rgba(255,255,255,.08)"),
              color:heat?"#ff6a00":T.textMute,
              animation:(!heat && potentialReaction && potentialReaction.needsHeat) ? "burnerPulse 1.2s infinite" : "none"
            }}
          >
            {heat ? "🔥 Bunsen Burner ON" : "🕯️ Burner OFF"}
          </button>
          {!timedActive && <button onClick={function(){startTimed();setTab("lab")}} style={{ padding:"5px 12px",borderRadius:14,fontSize:11,fontWeight:700,fontFamily:"inherit",cursor:"pointer",background:"rgba(255,215,0,.08)",border:"1px solid rgba(255,215,0,.25)",color:"#ffd700" }}>⏱️ 60s Challenge</button>}
        </div>

        <div style={{ margin:"6px 14px 0",background:T.beakerBg,border:"1.5px solid "+T.headerBorder,borderRadius:12,padding:"10px 8px",position:"relative",overflow:"hidden" }}>
          <div style={{ display:"flex",alignItems:"center",justifyContent:"center",gap:6,position:"relative",zIndex:2,flexWrap:"wrap" }}>
            {[0,1].map(function(i) {
              var item = bench[i];
              if (item) return <div key={i} style={{ width:72 }}>
                <div onClick={function(){removeItem(item.id)}} style={{ background:item.color+"08",border:"1.5px solid "+item.color+"44",borderRadius:10,padding:"7px 2px",textAlign:"center",cursor:"pointer",position:"relative",animation:"popIn .3s" }}>
                  <div style={{ position:"absolute",top:-4,right:-4,width:14,height:14,borderRadius:"50%",background:"#ef5350",color:"#fff",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center" }}>x</div>
                  <div style={{ fontSize:20 }}>{item.icon}</div>
                  <div style={{ fontSize:11,fontWeight:700,color:item.color }}>{item.name}</div>
                </div>
              </div>;
              return <div key={i} style={{ width:72 }}>
                <div style={{ border:"1.5px dashed "+T.headerBorder,borderRadius:10,padding:"12px 2px",textAlign:"center" }}>
                  <div style={{ fontSize:17,color:T.textMute }}>+</div>
                </div>
              </div>;
            })}
            <div style={{ fontSize:17,color:T.textMute,alignSelf:"center" }}>{">"}</div>
            <div style={{ display:"flex",flexDirection:"column",alignItems:"center" }}>
              <Beaker bench={bench} running={running} done={done} color={result?result.color:(reaction?reaction.color:T.textDim)} T={T}/>
              <div style={{ marginTop:-8 }}>
                <BunsenBurner heat={heat} T={T}/>
              </div>
            </div>
            <div style={{ alignSelf:"flex-end",marginBottom:30 }}>
              <Thermometer temp={result?result.temp:(reaction?reaction.temp:null)} active={running||done} T={T}/>
            </div>
          </div>

          {particles.map(function(p) {
            return <div key={p.id} style={{ position:"absolute",left:p.x+"%",top:p.y+"%",width:p.sz,height:p.sz,borderRadius:"50%",background:p.color,opacity:p.life,pointerEvents:"none",boxShadow:"0 0 "+p.sz+"px "+p.color+"88",zIndex:10 }} />;
          })}

          <div style={{ textAlign:"center",fontSize:12,marginTop:8,minHeight:14,zIndex:2,position:"relative" }}>
            {bench.length===0 && <span style={{ color:T.textDim }}>Tap 2 chemicals above</span>}
            {bench.length===1 && <span style={{ color:T.textDim }}>Pick one more <span style={{ color:"#00e676",fontSize:10 }}>(green glow = compatible)</span></span>}
            {bench.length===2 && !reaction && !potentialReaction && <span style={{ color:"#ef5350" }}>No reaction - try different combo!</span>}
            {bench.length===2 && !reaction && potentialReaction && potentialReaction.needsHeat && !heat && (
              <span style={{ color:"#ff9100",fontWeight:700 }}>🔥 Reaction requires Heat! Turn Bunsen Burner ON.</span>
            )}
            {bench.length===2 && reaction && !running && !done && <span style={{ color:"#00e676",fontWeight:700 }}>{reaction.name}</span>}
            {running && <span style={{ color:"#ffc107",fontWeight:700 }}>Reacting...</span>}
            {done && <span style={{ color:"#00e676",fontWeight:700 }}>Experiment complete!</span>}
          </div>

          <button
            onClick={runExperiment}
            disabled={!reaction||running||done}
            style={{
              width:"100%",padding:10,border:"none",borderRadius:8,fontSize:13,fontWeight:800,letterSpacing:".06em",
              fontFamily:"inherit",marginTop:6,
              background:reaction&&!running&&!done?"linear-gradient(135deg,#00e676,#00c853)":T.surfaceAlt,
              color:reaction&&!running&&!done?"#000":T.textDim,
              cursor:reaction&&!running&&!done?"pointer":"default"
            }}
          >
            {running ? "REACTING..." : done ? "DONE" : reaction ? (reaction.needsHeat ? "HEAT & REACT 🔥" : "MIX & REACT") : (potentialReaction && potentialReaction.needsHeat && !heat ? "NEEDS HEAT" : "SELECT 2 ITEMS")}
          </button>
        </div>

        {result && <div style={{ margin:"8px 14px 0",background:T.isLight?"rgba(255,255,255,.9)":"rgba(6,10,18,.9)",border:"1px solid "+T.headerBorder,borderRadius:12,padding:10,animation:"fadeUp .4s ease-out" }}>
          <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:8 }}>
            <div style={{ width:40,height:40,borderRadius:"50%",background:"linear-gradient(135deg,#00e676,#00c853)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flexShrink:0 }}>
              <span style={{ fontSize:17,fontWeight:900,color:"#000" }}>{result.score}</span>
            </div>
            <div>
              <h2 style={{ fontSize:14,fontWeight:800,margin:0,color:T.text }}>{result.name}</h2>
              <div style={{ display:"inline-block",fontSize:9,padding:"2px 6px",borderRadius:4,marginTop:2,background:result.color+"15",color:result.color,border:"1px solid "+result.color+"28",fontWeight:600 }}>{result.type.replace("_"," ")}</div>
            </div>
          </div>
          <div style={{ background:"rgba(0,230,118,.04)",border:"1px solid rgba(0,230,118,.1)",borderRadius:6,padding:7,marginBottom:5 }}>
            <div style={{ fontSize:9,color:"#00e676",fontWeight:700 }}>EQUATION</div>
            <div style={{ fontSize:13,color:T.isLight?"#2e7d32":"#a5d6a7",marginTop:2 }}>{result.eq}</div>
          </div>

          {(function() {
            var prods = parseProducts(result.eq);
            if (!prods.length) return null;
            return (
              <div style={{ background:T.surfaceAlt,border:"1px solid "+T.borderSoft,borderRadius:8,padding:8,marginBottom:5 }}>
                <div style={{ fontSize:9,color:"#40c4ff",fontWeight:700,marginBottom:4 }}>MOLECULAR STRUCTURE</div>
                <div style={{ display:"flex",justifyContent:"center",gap:14,flexWrap:"wrap" }}>
                  {prods.slice(0,3).map(function(p,i) {
                    return <MoleculeView key={i} molKey={p} T={T}/>;
                  })}
                </div>
              </div>
            );
          })()}

          <div style={{ display:"flex",gap:4,marginBottom:5 }}>
            <div style={{ flex:1,background:T.surfaceAlt,borderRadius:5,padding:5,textAlign:"center" }}>
              <div style={{ fontSize:15 }}>{result.temp==="exo"?"🔥":result.temp==="endo"?"❄️":"--"}</div>
              <div style={{ fontSize:9,fontWeight:700,color:result.temp==="exo"?"#ff6a00":result.temp==="endo"?"#00bcd4":T.textMute }}>{result.temp==="exo"?"EXOTHERMIC":result.temp==="endo"?"ENDOTHERMIC":"NEUTRAL"}</div>
            </div>
            <div style={{ flex:1,background:T.surfaceAlt,borderRadius:5,padding:5,textAlign:"center" }}>
              <div style={{ fontSize:13,color:scol(result.speed),fontWeight:700 }}>{sdots(result.speed)}</div>
              <div style={{ fontSize:9,fontWeight:700,color:scol(result.speed),marginTop:1 }}>{result.speed.toUpperCase()}</div>
            </div>
          </div>
          {result.pH !== null && <div style={{ background:T.surfaceAlt,borderRadius:5,padding:6,marginBottom:5 }}>
            <div style={{ height:7,borderRadius:4,background:"linear-gradient(90deg,#ff1744,#ff5722,#ffab00,#cddc39,#76ff03,#00e5ff,#2979ff,#7c4dff)",position:"relative" }}>
              <div style={{ position:"absolute",left:(result.pH/14*100)+"%",top:-2,transform:"translateX(-50%)",width:7,height:11,borderRadius:4,border:"2px solid #fff",background:pHColor(result.pH) }} />
            </div>
            <div style={{ fontSize:11,color:pHColor(result.pH),fontWeight:700,marginTop:2 }}>pH {result.pH} - {pHLabel(result.pH)}</div>
          </div>}
          <div style={{ marginBottom:5 }}>
            <div style={{ fontSize:10,fontWeight:700,color:"#90caf9" }}>What Happened?</div>
            <p style={{ fontSize:12,color:T.text,lineHeight:1.4,margin:"2px 0 0" }}>{result.explain}</p>
          </div>
          <div style={{ background:"rgba(255,215,0,.04)",border:"1px solid rgba(255,215,0,.1)",borderRadius:5,padding:6,marginBottom:6 }}>
            <div style={{ fontSize:9,color:"#ffd700",fontWeight:700 }}>FUN FACT</div>
            <p style={{ fontSize:12,color:T.text,lineHeight:1.4,margin:"2px 0 0" }}>{result.fact}</p>
          </div>
          <button onClick={clearAll} style={{ width:"100%",padding:8,background:T.surfaceAlt,border:"1px solid "+T.borderSoft,borderRadius:6,color:T.textDim,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit" }}>Try Another</button>
        </div>}
      </div>}

      {tab === "log" && <div style={{ padding:14 }}>
        <div style={{ textAlign:"center",marginBottom:10 }}>
          <div style={{ fontSize:22,fontWeight:900,color:"#00e676" }}>{log.length}<span style={{ fontSize:14,color:T.textMute }}>/{RXN.length}</span></div>
          <div style={{ height:4,borderRadius:2,background:T.surfaceAlt,marginTop:5,overflow:"hidden" }}><div style={{ height:"100%",borderRadius:2,background:"linear-gradient(90deg,#00e676,#00c853)",width:(log.length/RXN.length*100)+"%" }} /></div>
        </div>

        <div style={{ display:"flex",gap:4,marginBottom:8,justifyContent:"center" }}>
          {["all","discovered","locked"].map(function(f) {
            return <button key={f} onClick={function(){setLogFilter(f)}} style={{ padding:"4px 10px",borderRadius:12,fontSize:11,fontWeight:700,fontFamily:"inherit",background:logFilter===f?"rgba(0,230,118,.15)":T.surfaceAlt,border:"1px solid "+(logFilter===f?"#00e676":T.borderSoft),color:logFilter===f?"#00e676":T.textDim,cursor:"pointer" }}>{f.toUpperCase()}</button>;
          })}
        </div>

        {RXN.filter(function(r) {
          var key = r.r.slice().sort().join("+");
          var found = log.indexOf(key) !== -1;
          if (logFilter === "discovered") return found;
          if (logFilter === "locked") return !found;
          return true;
        }).map(function(r,ri) {
          var key = r.r.slice().sort().join("+");
          var found = log.indexOf(key) !== -1;
          return <div key={ri} onClick={function(){if(found){setViewLogItem(r);playBeep("tick");}}} style={{ display:"flex",alignItems:"center",gap:6,padding:"7px 9px",marginBottom:3,background:found?"rgba(0,230,118,.05)":T.surfaceAlt,border:"1px solid "+(found?"rgba(0,230,118,.15)":T.borderSoft),borderRadius:6,cursor:found?"pointer":"default",opacity:found?1:0.35 }}>
            <span style={{ fontSize:14 }}>{found?"✅":"🔒"}</span>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:12,fontWeight:700,color:found?T.text:T.textMute }}>{found?r.name:"???"}</div>
              {found && <div style={{ fontSize:10,color:T.textDim }}>{r.eq}</div>}
            </div>
            {found && <span style={{ fontSize:11,color:"#00e676",fontWeight:800 }}>{r.score} pts</span>}
          </div>;
        })}
      </div>}

      {tab === "challenge" && <div style={{ padding:14 }}>
        <div style={{ textAlign:"center",marginBottom:10 }}>
          <div style={{ fontSize:22,fontWeight:900,color:"#ffd700" }}>{cDone.length}<span style={{ fontSize:14,color:T.textMute }}>/{CHALLENGES.length}</span></div>
          <p style={{ fontSize:11,color:T.textDim,marginTop:2 }}>Complete lab quests by synthesizing target reactions!</p>
        </div>
        {CHALLENGES.map(function(ch) {
          var s = cDone.indexOf(ch.id) !== -1;
          return <div key={ch.id} style={{ display:"flex",alignItems:"center",gap:8,padding:"8px 10px",marginBottom:4,background:s?"rgba(255,215,0,.06)":T.surfaceAlt,border:"1px solid "+(s?"rgba(255,215,0,.2)":T.borderSoft),borderRadius:8 }}>
            <span style={{ fontSize:18 }}>{s?"🏆":"🎯"}</span>
            <div style={{ flex:1 }}><div style={{ fontSize:12,fontWeight:700,color:s?"#ffd700":T.text }}>{ch.text}</div><div style={{ fontSize:10,color:T.textMute }}>{s?"Quest Completed!":"Go to Lab and mix chemicals"}</div></div>
          </div>;
        })}
      </div>}

      {tab === "badges" && <div style={{ padding:14 }}>
        <div style={{ textAlign:"center",marginBottom:10 }}>
          <div style={{ fontSize:22,fontWeight:900,color:"#ffd700" }}>{earnedAch.length}<span style={{ fontSize:14,color:T.textMute }}>/{ACHIEVEMENTS.length}</span></div>
          <p style={{ fontSize:11,color:T.textDim,marginTop:2 }}>Unlock badges by making discoveries and mastering chemistry.</p>
        </div>
        {ACHIEVEMENTS.map(function(a) {
          var earned = a.check(log);
          return <div key={a.id} style={{ display:"flex",alignItems:"center",gap:10,padding:"9px 12px",marginBottom:4,background:earned?"rgba(255,215,0,.06)":T.surfaceAlt,border:"1px solid "+(earned?"rgba(255,215,0,.2)":T.borderSoft),borderRadius:8,opacity:earned?1:0.4 }}>
            <span style={{ fontSize:24 }}>{earned?a.icon:"🔒"}</span>
            <div><div style={{ fontSize:13,fontWeight:700,color:earned?"#ffd700":T.textDim }}>{a.title}</div><div style={{ fontSize:11,color:T.textDim }}>{a.desc}</div></div>
          </div>;
        })}
      </div>}

      {tab === "stats" && <div style={{ padding:14 }}>
        <div style={{ fontSize:16,color:"#ffd700",fontWeight:800,marginBottom:10,textAlign:"center" }}>YOUR LABORATORY STATS</div>
        <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:14 }}>
          <div style={{ background:"rgba(0,230,118,.06)",border:"1px solid rgba(0,230,118,.15)",borderRadius:10,padding:12,textAlign:"center" }}>
            <div style={{ fontSize:24,fontWeight:900,color:"#00e676" }}>{totalScore}</div>
            <div style={{ fontSize:10,color:T.textDim }}>SCORE</div>
          </div>
          <div style={{ background:"rgba(64,196,255,.06)",border:"1px solid rgba(64,196,255,.15)",borderRadius:10,padding:12,textAlign:"center" }}>
            <div style={{ fontSize:24,fontWeight:900,color:"#40c4ff" }}>{log.length}</div>
            <div style={{ fontSize:10,color:T.textDim }}>REACTIONS</div>
          </div>
          <div style={{ background:"rgba(255,215,0,.06)",border:"1px solid rgba(255,215,0,.15)",borderRadius:10,padding:12,textAlign:"center" }}>
            <div style={{ fontSize:24,fontWeight:900,color:"#ffd700" }}>{earnedAch.length}</div>
            <div style={{ fontSize:10,color:T.textDim }}>BADGES</div>
          </div>
        </div>

        <div style={{ background:T.surfaceAlt,border:"1px solid "+T.borderSoft,borderRadius:10,padding:12,marginBottom:12 }}>
          <div style={{ fontSize:13,fontWeight:700,color:"#ffd700",marginBottom:4 }}>⏱️ 60-SECOND SPEED CHALLENGE</div>
          <div style={{ fontSize:12,color:T.text,marginBottom:8 }}>Find as many reactions as you can before the clock expires!</div>
          {timedBest !== null && <div style={{ fontSize:14,color:"#00e676",fontWeight:700,marginBottom:8 }}>Personal Best: {timedBest} reactions in 60s</div>}
          {!timedActive && <button onClick={function(){startTimed();setTab("lab")}} style={{ width:"100%",padding:10,background:"linear-gradient(135deg,#ffd700,#ff9100)",border:"none",borderRadius:8,fontSize:14,fontWeight:800,color:"#000",cursor:"pointer",fontFamily:"inherit" }}>START 60s CHALLENGE</button>}
        </div>

        <div style={{ background:T.surfaceAlt,border:"1px solid "+T.borderSoft,borderRadius:10,padding:12,marginBottom:14 }}>
          <div style={{ fontSize:13,fontWeight:700,color:"#ef5350",marginBottom:4 }}>RESET LABORATORY DATA</div>
          <p style={{ fontSize:11,color:T.textDim,marginBottom:8 }}>Reset your discovered reactions and start afresh.</p>
          <button onClick={resetProgress} style={{ padding:"8px 14px",background:"rgba(255,80,80,.1)",border:"1px solid rgba(255,80,80,.3)",borderRadius:6,color:"#ef5350",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit" }}>RESET PROGRESS</button>
        </div>

        <div style={{ fontSize:12,fontWeight:700,color:T.textDim,marginBottom:6 }}>TOP DISCOVERIES</div>
        {RXN.filter(function(r){return log.indexOf(r.r.slice().sort().join("+"))!==-1}).sort(function(a,b){return b.score-a.score}).slice(0,8).map(function(r,i) {
          return <div key={i} style={{ display:"flex",alignItems:"center",gap:6,padding:"6px 8px",marginBottom:2,background:T.surfaceAlt,borderRadius:5 }}>
            <span style={{ fontSize:12,fontWeight:900,color:i===0?"#ffd700":i===1?T.text:T.textDim,width:16 }}>#{i+1}</span>
            <span style={{ flex:1,fontSize:11,color:T.text }}>{r.name}</span>
            <span style={{ fontSize:12,fontWeight:700,color:"#00e676" }}>{r.score}</span>
          </div>;
        })}
        {log.length === 0 && <div style={{ textAlign:"center",color:T.textMute,fontSize:13,padding:20 }}>No reactions yet! Go experiment in the Lab!</div>}
      </div>}

      {/* Discovered Reaction Modal */}
      {viewLogItem && <ReactionModal rxn={viewLogItem} T={T} onClose={function(){setViewLogItem(null)}} />}
    </div>
  );
}

/* ═══ MAIN MENU ═══ */
function MainMenu(props) {
  var isLight = props.theme === "light";
  var bgGrad = isLight
    ? "radial-gradient(ellipse at center,#f5f8fc 0%,#dde6f0 70%)"
    : "radial-gradient(ellipse at center,#0d1226 0%,#060710 70%)";
  var subColor = isLight ? "#5a6378" : "#7a8599";
  var footColor = isLight ? "#8a94a6" : "#4a5266";
  return (
    <div style={{ position:"fixed",inset:0,background:bgGrad,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:"'Courier New',monospace",padding:24 }}>
      <button
        onClick={function(){props.setTheme(isLight?"dark":"light")}}
        style={{ position:"absolute",top:16,right:16,width:38,height:38,borderRadius:"50%",border:"1px solid "+(isLight?"rgba(0,0,0,.15)":"rgba(255,255,255,.15)"),background:isLight?"rgba(255,255,255,.6)":"rgba(255,255,255,.05)",fontSize:16,cursor:"pointer",fontFamily:"inherit" }}
      >{isLight?"☀":"🌙"}</button>

      <div style={{ fontSize:78,animation:"float 2.4s ease-in-out infinite",filter:"drop-shadow(0 0 22px rgba(0,230,118,.55))" }}>⚗️</div>
      <div style={{ marginTop:20,fontSize:28,fontWeight:900,letterSpacing:4,color:"#00e676",textShadow:"0 0 16px rgba(0,230,118,.6)",textAlign:"center" }}>LAB CRAFT</div>
      <div style={{ marginTop:6,fontSize:13,letterSpacing:3,color:subColor }}>MIX • REACT • DISCOVER</div>

      <button
        onClick={props.onPlay}
        style={{
          marginTop:48,padding:"18px 64px",
          background:"linear-gradient(135deg,#00e676,#00b248)",
          border:"none",borderRadius:14,
          fontSize:18,fontWeight:900,letterSpacing:3,color:"#000",
          cursor:"pointer",fontFamily:"inherit",
          animation:"glow 2.2s ease-in-out infinite"
        }}
      >▶ PLAY</button>

      <div style={{ marginTop:44,fontSize:11,color:footColor,letterSpacing:1,textAlign:"center" }}>
        v2.0 • 118 Elements • 44+ Reactions • Offline Ready
      </div>
    </div>
  );
}

function LoadingDialog(props) {
  return (
    <div style={{ position:"fixed",inset:0,background:"rgba(6,7,16,.92)",backdropFilter:"blur(4px)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:"'Courier New',monospace",zIndex:10000 }}>
      <div style={{ width:48,height:48,border:"3px solid rgba(0,230,118,.15)",borderTopColor:"#00e676",borderRadius:"50%",animation:"spin 1s linear infinite" }}/>
      <div style={{ marginTop:18,fontSize:15,fontWeight:700,color:"#00e676",letterSpacing:2 }}>{props.message || "LOADING..."}</div>
      {props.sub && <div style={{ marginTop:6,fontSize:12,color:"#7a8599",letterSpacing:1 }}>{props.sub}</div>}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("menu");
  const [theme, setTheme] = useState(function() {
    try {
      return localStorage.getItem("labcraft_v2_theme") || "dark";
    } catch(e) { return "dark"; }
  });

  useEffect(function() {
    try { localStorage.setItem("labcraft_v2_theme", theme); } catch(e){}
  }, [theme]);

  const screenRef = useRef(screen);
  useEffect(function() { screenRef.current = screen; }, [screen]);

  useEffect(function() {
    return window.pushBackHandler(function() {
      var s = screenRef.current;
      if (s === "lab") { setScreen("menu"); return true; }
      return false;
    });
  }, []);

  const handlePlay = useCallback(function() {
    setScreen("loading");
    setTimeout(function() {
      setScreen("lab");
    }, 50);
  }, []);

  if (screen === "menu") return <MainMenu onPlay={handlePlay} theme={theme} setTheme={setTheme} />;
  if (screen === "loading") return <LoadingDialog message="PREPARING LAB" sub="Setting up elements & reactions" />;
  return <LabCraft theme={theme} setTheme={setTheme} />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));

</script>
</body>
</html>
