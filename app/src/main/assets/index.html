                background:selectedPlan==="lifetime"?"linear-gradient(135deg,#ffd700,#ff9100)":"linear-gradient(135deg,#00e5ff,#00e676)",
                color:"#000",fontSize:14,fontWeight:900,fontFamily:"inherit",letterSpacing:0.5,
                boxShadow:"0 4px 18px rgba(255,215,0,.28)",opacity:busy?0.75:1
              }}
            >
              {busy ? "CONNECTING GOOGLE PLAY..." : (selectedPlan==="lifetime" ? ("UNLOCK LIFETIME FOR " + lifetimePrice) : ("SUBSCRIBE FOR " + monthlyPrice + " / MONTH"))}
            </button>
          </div>
        )}

        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,paddingTop:8,borderTop:"1px solid "+(isLight?"rgba(0,0,0,.08)":"rgba(255,255,255,.08)") }}>
          <button
            onClick={handleRestore}
            disabled={busy}
            style={{ background:"transparent",border:"1px solid "+(isLight?"rgba(0,0,0,.18)":"rgba(255,255,255,.2)"),borderRadius:8,padding:"7px 12px",color:dim,fontSize:11,fontWeight:800,cursor:"pointer",fontFamily:"inherit" }}
          >
            🔄 Restore Purchase
          </button>
          <span style={{ fontSize:9.5,color:dim,textAlign:"right" }}>
            Billed securely via Google Play
          </span>
        </div>
      </div>
    </div>
  );
}

function LoadingDialog(props) {
  return (
    <div style={{ position:"fixed",inset:0,background:"rgba(6,7,16,.92)",backdropFilter:"blur(4px)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:"'Courier New',monospace",zIndex:10000 }}>
      <div style={{ width:48,height:48,border:"3px solid rgba(0,230,118,.15)",borderTopColor:"#00e676",borderRadius:"50%",animation:"spin 1s linear infinite" }}/>
      <div style={{ marginTop:18,fontSize:15,fontWeight:700,color:"#00e676",letterSpacing:2 }}>{props.message || "LOADING..."}</div>
      {props.sub && <div style={{ marginTop:6,fontSize:12,color:"#7a8599",letterSpacing:1 }}>{props.sub}</div>}
    

</div>
  );
}

function App() {
  const [screen, setScreen] = useState("menu");
  const [theme, setTheme] = useState(function() {
    try {
      return localStorage.getItem("labcraft_v2_theme") || "dark";
    } catch(e) { return "dark"; }
  });

  const [billingState, setBillingState] = useState(function() {
    var fallback = {
      isPro: false,
      activePlan: "",
      monthlyPrice: "₹199",
      lifetimePrice: "₹999",
      storeReady: false
    };
    try {
      if (window.Android && typeof window.Android.getBillingStateJson === "function") {
        var parsed = JSON.parse(window.Android.getBillingStateJson());
        window._labCraftIsPro = !!parsed.isPro;
        return parsed;
      }
    } catch(e) {}
    return fallback;
  });
  const [showProModal, setShowProModal] = useState(false);
  const [billingFeedback, setBillingFeedback] = useState(null);

  useEffect(function() {
    window.onLabCraftBillingUpdate = function(nextState) {
      if (!nextState) return;
      window._labCraftIsPro = !!nextState.isPro;
      setBillingState(nextState);
    };
    window.onLabCraftBillingEvent = function(evt) {
      if (!evt) return;
      setBillingFeedback(evt);
      if (evt.status === "purchased") {
        try {
          playBeep("achievement");
          triggerHaptic("achievement");
          triggerConfettiBurst();
        } catch(e) {}
      }
    };
    return function() {
      window.onLabCraftBillingUpdate = null;
      window.onLabCraftBillingEvent = null;
    };
  }, []);

  const handleOpenPro = useCallback(function() {
    setBillingFeedback(null);
    setShowProModal(true);
  }, []);

  const handlePurchasePlan = useCallback(function(planType) {
    if (window.Android && typeof window.Android.purchasePro === "function") {
      try {
        window.Android.purchasePro(planType);
      } catch(e) {
        setBillingFeedback({ status: "error", message: "Failed to start Google Play checkout." });
      }
    } else {
      setBillingFeedback({
        status: "info",
        message: "Preview mode: Google Play Billing checkout (" + (planType === "lifetime" ? "₹999 one-time" : "₹199/month") + ") runs inside the Android app."
      });
    }
  }, []);

  const handleRestorePurchases = useCallback(function() {
    if (window.Android && typeof window.Android.restorePurchases === "function") {
      try {
        window.Android.restorePurchases();
      } catch(e) {
        setBillingFeedback({ status: "error", message: "Could not contact Google Play." });
      }
    } else {
      setBillingFeedback({ status: "info", message: "Preview mode: Restore Purchases works on Android devices signed in with Google Play." });
    }
  }, []);

  useEffect(function() {
    try { localStorage.setItem("labcraft_v2_theme", theme); } catch(e){}
  }, [theme]);

  const screenRef = useRef(screen);
  useEffect(function() { screenRef.current = screen; }, [screen]);

  useEffect(function() {
    return window.pushBackHandler(function() {
      var s = screenRef.current;
      if (s === "lab") { setScreen("menu"); return true; }
      return false;
    });
  }, []);

  const [initialTab, setInitialTab] = useState("lab");

  const handlePlay = useCallback(function() {
    setInitialTab("lab");
    setScreen("loading");
    setTimeout(function() {
      setScreen("lab");
    }, 50);
  }, []);

        const handleOpenScientistID = useCallback(function() {
    setInitialTab("lab");
    setScreen("loading");
    setTimeout(function() {
      setScreen("lab");
      if (typeof window._openScientistID === "function") window._openScientistID();
    }, 50);
  }, []);

  const handleOpenMegaFX = useCallback(function() {
    setInitialTab("lab");
    setScreen("loading");
    setTimeout(function() {
      setScreen("lab");
      if (typeof window._openMegaFX === "function") window._openMegaFX();
    }, 50);
  }, []);

  const handleOpenChemle = useCallback(function() {
    setInitialTab("chemle");
    setScreen("loading");
    setTimeout(function() {
      setScreen("lab");
    }, 50);
  }, []);

  const handleOpenPeriodic = useCallback(function() {
    setInitialTab("periodic");
    setScreen("loading");
    setTimeout(function() {
      setScreen("lab");
    }, 50);
  }, []);

  const handleOpenMole = useCallback(function() {
    setInitialTab("mole");
    setScreen("loading");
    setTimeout(function() {
      setScreen("lab");
    }, 50);
  }, []);

  return (
    <React.Fragment>
      {screen === "menu" && (
        <MainMenu
          onPlay={handlePlay}
          onOpenMole={handleOpenMole}
          onOpenPeriodic={handleOpenPeriodic}
          onOpenChemle={handleOpenChemle}
          onOpenMegaFX={handleOpenMegaFX}
          onOpenScientistID={handleOpenScientistID}
          onOpenPro={handleOpenPro}
          isPro={!!billingState.isPro}
          billingState={billingState}
          theme={theme}
          setTheme={setTheme}
        />
      )}
      {screen === "loading" && <LoadingDialog message="PREPARING LAB" sub="Setting up elements & reactions" />}
      {screen !== "menu" && screen !== "loading" && (
        <LabCraft
          theme={theme}
          setTheme={setTheme}
          initialTab={initialTab}
          isPro={!!billingState.isPro}
          billingState={billingState}
          onOpenPro={handleOpenPro}
        />
      )}
      {showProModal && (
        <ProUpgradeModal
          theme={theme}
          billingState={billingState}
          billingFeedback={billingFeedback}
          onPurchase={handlePurchasePlan}
          onRestore={handleRestorePurchases}
          onClose={function(){ setShowProModal(false); }}
        />
      )}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));

</script>
</body>
</html>
