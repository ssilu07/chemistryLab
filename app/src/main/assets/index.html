function copyTextFallback(text, onSuccess) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {

  } catch(e) {

  }

  try {

    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");

    osc.type = "sine";
    osc.frequency.setValueAtTime(1400, now);

    g.gain.setValueAtTime(0.4, now);
    g.gain.linearRampToValueAtTime(0, now + 0.05);
    osc.connect(g);
    g.connect(a.destination);
    osc.start(now);
    osc.stop(now + 0.05);

    osc2.type = "triangle";

    osc2.connect(g2);
    g2.connect(a.destination);
    osc2.start(now + 0.06);
    osc2.stop(now + 0.12);
  } catch(e){}
}

  if (v == null || isNaN(v)) return "#3a3a3a";
  var t = (v - min) / (max - min);
  t = Math.max(0, Math.min(1, t));
  var h = 240 * (1 - t);
  return "hsl(" + h + ",75%,50%)";
}

var _audioCtx = null;
var _noiseBuffer = null;
function getAudioCtx() {
  if (!_audioCtx) {
    try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; }
  }
  if (_audioCtx && _audioCtx.state === "suspended") { try { _audioCtx.resume(); } catch(e){} }
  return _audioCtx;
}
function getNoiseBuffer(ctx) {
  if (_noiseBuffer) return _noiseBuffer;
  var len = ctx.sampleRate * 2;
  _noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
  var d = _noiseBuffer.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return _noiseBuffer;
}

function _bubble(ctx, t, freq, amp) {
  var o = ctx.createOscillator();
  var g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(freq * 2.2, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(60, freq * 0.5), t + 0.08);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(amp, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + 0.14);
}

function playFizz() {
  var ctx = getAudioCtx(); if (!ctx) return;
  var t0 = ctx.currentTime;
  var src = ctx.createBufferSource(); src.buffer = getNoiseBuffer(ctx); src.loop = true;
  var hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1800; hp.Q.value = 0.7;
  var hg = ctx.createGain();
  hg.gain.setValueAtTime(0.0001, t0);
  hg.gain.exponentialRampToValueAtTime(0.05, t0 + 0.08);
  hg.gain.linearRampToValueAtTime(0.04, t0 + 1.4);
  hg.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.0);
  src.connect(hp); hp.connect(hg); hg.connect(ctx.destination);
  src.start(t0); src.stop(t0 + 2.05);
  for (var i = 0; i < 22; i++) {
    var bt = t0 + 0.05 + Math.random() * 1.7;
    var f = 180 + Math.random() * 520;
    _bubble(ctx, bt, f, 0.07 + Math.random() * 0.06);
  }
}

function playExplode() {
  var ctx = getAudioCtx(); if (!ctx) return;
  var t0 = ctx.currentTime;
  var src = ctx.createBufferSource(); src.buffer = getNoiseBuffer(ctx);
  var lp = ctx.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(2400, t0);
  lp.frequency.exponentialRampToValueAtTime(180, t0 + 0.7);
  var ng = ctx.createGain();
  ng.gain.setValueAtTime(0.5, t0);
  ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.85);
  src.connect(lp); lp.connect(ng); ng.connect(ctx.destination);
  src.start(t0); src.stop(t0 + 0.9);

  var o = ctx.createOscillator();
  var og = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(140, t0);
  o.frequency.exponentialRampToValueAtTime(38, t0 + 0.5);
  og.gain.setValueAtTime(0.6, t0);
  og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
  o.connect(og); og.connect(ctx.destination);

}

function findReaction(b, isHeated) {
  if (b.length !== 2) return null;
  var ids = [b[0].id, b[1].id];
  return RXN.find(function(r) {
    if (r.r.indexOf(ids[0]) === -1 || r.r.indexOf(ids[1]) === -1) return false;
    if (r.needsHeat && !isHeated) return false;
    return true;
  }) || null;
}

function findPotentialReaction(b) {
  if (b.length !== 2) return null;
  var ids = [b[0].id, b[1].id];
  return RXN.find(function(r) {
    return r.r.indexOf(ids[0]) !== -1 && r.r.indexOf(ids[1]) !== -1;
  }) || null;
}

function pHColor(pH) {
  if (pH === null) return "#666";
  if (pH <= 2) return "#ff1744"; if (pH <= 4) return "#ff5722"; if (pH <= 6) return "#ffab00";
  if (pH === 7) return "#76ff03"; if (pH <= 9) return "#00e5ff"; if (pH <= 11) return "#2979ff";
  return "#7c4dff";
}

function pHLabel(pH) {
  if (pH === null) return "N/A";
  if (pH <= 2) return "Strongly Acidic"; if (pH <= 6) return "Acidic";
  if (pH === 7) return "Neutral"; if (pH <= 11) return "Basic";

}

function parseProducts(eq) {
  var rhs = eq.split("->")[1] || "";
  return rhs.split("+").map(function(p) {
    return p.trim().replace(/^\d+\s*/, "").split(/\s+/)[0];
  }).filter(function(p) { return p && p !== "fire" && p !== "heat" && p !== "light" && p !== "lilac" && MOL[p]; });
}

/* ═══ PARTICLES HOOK ═══ */
function useParticles() {
  var ref = useRef([]);
  var idRef = useRef(0);
  var [tick, setTick] = useState(0);

  var emit = useCallback(function(color, type, count) {
    var n = count || 15;
    var isFoam = type === "elephant_foam";
    var isGlow = type === "luminol_glow";
    for (var i = 0; i < n; i++) {
      var vx, vy, sz, life, pColor;
      if (isFoam) {
        vx = (Math.random() - 0.5) * 8;
        vy = -(Math.random() * 12 + 6);
        sz = Math.random() * 16 + 8;
        life = 1.2;
        pColor = Math.random() > 0.4 ? color : (Math.random() > 0.5 ? "#ffffff" : "#ffd54f");
      } else if (isGlow) {
        vx = (Math.random() - 0.5) * 4;
        vy = -(Math.random() * 5 + 1);
        sz = Math.random() * 8 + 3;
        life = 1.4;
        pColor = Math.random() > 0.4 ? "#00e5ff" : "#80d8ff";
      } else {
        vx = (Math.random() - 0.5) * (type === "explode" ? 10 : 3);
        vy = type === "explode" ? -(Math.random() * 10 + 2) : -(Math.random() * 4 + 1);
        sz = Math.random() * 6 + 2;
        life = 1;
        pColor = color;
      }
      ref.current.push({
        id: idRef.current++, x: 45 + Math.random() * 10, y: 40 + Math.random() * 20,
        vx: vx, vy: vy, sz: sz, color: pColor, life: life, type: type
      });
    }
    setTick(function(t){return t+1});
  }, []);

  useEffect(function() {
    if (!ref.current.length) return;
    var timer = setInterval(function() {
      ref.current = ref.current.map(function(p) {
        return { ...p, x:p.x+p.vx*0.25, y:p.y+p.vy*0.25+0.15, vy:p.vy+0.1, life:p.life-0.02, sz:p.sz*0.98 };
      }).filter(function(p) { return p.life > 0; });
      setTick(function(t){return t+1});
    }, 30);
    return function() { clearInterval(timer); };
  }, [tick > 0 ? 1 : 0]);

  return { particles: ref.current, emit: emit };
}

/* ═══ PERIODIC TRENDS GRAPH ═══ */
function TrendsGraph(props) {
  var prop = COLOR_PROPS[props.prop];
  var T = props.T;
  if (!prop || !prop.get) return null;
  var W = 340, H = 200;
  var pad = { l:36, r:10, t:14, b:24 };
  var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;

  var points = EL.map(function(e) { return { n:e.n, v:prop.get(e), cat:e.cat, s:e.s }; })
                 .filter(function(p) { return p.v != null && !isNaN(p.v); });
  if (!points.length) return <div style={{ color:T.textDim, fontSize:13, padding:20 }}>No data</div>;

  var vMin = Math.min.apply(null, points.map(function(p){return p.v}));
  var vMax = Math.max.apply(null, points.map(function(p){return p.v}));
  if (vMin === vMax) vMax = vMin + 1;
  var nMax = 118;

  function px(n) { return pad.l + (n / nMax) * iw; }
  function py(v) { return pad.t + ih - ((v - vMin) / (vMax - vMin)) * ih; }

  var yTicks = [vMin, (vMin+vMax)/2, vMax];
  var fmt = function(v) {
    var a = Math.abs(v);
    if (a >= 1000) return Math.round(v);
    if (a >= 10) return Math.round(v*10)/10;
    return Math.round(v*100)/100;
  };

  var periodStarts = [3,11,19,37,55,87];
  var lineColor = T.isLight ? "#1976d2" : "#40c4ff";

  return (
    <svg width="100%" height={H} viewBox={"0 0 "+W+" "+H} preserveAspectRatio="xMidYMid meet">
      {periodStarts.map(function(s, i) {
        return <line key={"ps"+i} x1={px(s)} y1={pad.t} x2={px(s)} y2={pad.t+ih} stroke={T.headerBorder} strokeWidth="0.5" strokeDasharray="2,3"/>;
      })}
      {yTicks.map(function(v, i) {
        var y = py(v);
        return <g key={"yt"+i}>
          <line x1={pad.l} y1={y} x2={W-pad.r} y2={y} stroke={T.headerBorder} strokeWidth="0.5"/>
          <text x={pad.l-5} y={y+3} fontSize="9" fill={T.textDim} textAnchor="end" fontFamily="inherit">{fmt(v)}</text>
        </g>;
      })}
      {[1,18,36,54,86,118].map(function(n, i) {
        var x = px(n);
        return <g key={"xt"+i}>
          <line x1={x} y1={pad.t+ih} x2={x} y2={pad.t+ih+3} stroke={T.headerBorder} strokeWidth="0.6"/>
          <text x={x} y={pad.t+ih+12} fontSize="9" fill={T.textDim} textAnchor="middle" fontFamily="inherit">{n}</text>
        </g>;
      })}
      <polyline points={points.map(function(p){return px(p.n)+","+py(p.v)}).join(" ")} fill="none" stroke={lineColor} strokeWidth="1" opacity="0.45"/>
      {points.map(function(p, i) {
        return <circle key={"d"+i} cx={px(p.n)} cy={py(p.v)} r="2.4" fill={CC[p.cat]||"#666"} stroke={T.isLight?"#fff":"#0a0e18"} strokeWidth="0.4"/>;
      })}
      <text x={W/2} y={H-2} fontSize="9" fill={T.textDim} textAnchor="middle" fontFamily="inherit">Atomic Number →</text>
      <text x={6} y={pad.t+ih/2} fontSize="9" fill={T.textDim} textAnchor="middle" fontFamily="inherit" transform={"rotate(-90 6 "+(pad.t+ih/2)+")"}>{prop.label}</text>
    </svg>
  );
}

/* ═══ BOHR ATOM MODEL ═══ */
const SHELL_LABELS = ["K","L","M","N","O","P","Q"];
const CORES = {
  '[He]': { 1:2 },
  '[Ne]': { 1:2, 2:8 },
  '[Ar]': { 1:2, 2:8, 3:8 },
  '[Kr]': { 1:2, 2:8, 3:18, 4:8 },
  '[Xe]': { 1:2, 2:8, 3:18, 4:18, 5:8 },
  '[Rn]': { 1:2, 2:8, 3:18, 4:32, 5:18, 6:8 }
};

function parseElectronShells(cfg) {
  var shells = {};
  if (!cfg) return [];
  var coreMatch = cfg.match(/^(\[[A-Za-z]+\])/);
  var rest = cfg;
  if (coreMatch) {
    var core = coreMatch[1];
    var base = CORES[core] || {};
    for (var k in base) shells[k] = base[k];
    rest = cfg.substring(core.length).trim();
  }
  var terms = rest.match(/(\d)([spdf])(\d+)/g) || [];
  for (var i = 0; i < terms.length; i++) {
    var m = terms[i].match(/(\d)([spdf])(\d+)/);
    if (m) {
      var n = parseInt(m[1], 10);
      var count = parseInt(m[3], 10);
      shells[n] = (shells[n] || 0) + count;
    }
  }
  var maxN = 1;
  for (var sk in shells) { var num = parseInt(sk, 10); if (num > maxN) maxN = num; }
  var res = [];
  for (var s = 1; s <= maxN; s++) res.push(shells[s] || 0);
  return res;
}

function BohrAtomView(props) {
  var el = props.element;
  var T = props.T;
  var shells = useMemo(function() {
    return parseElectronShells(el.config);
  }, [el.config]);

  var size = 160;
  var cx = size / 2, cy = size / 2;
  var maxR = 70;
  var minR = 22;
  var nShells = Math.max(shells.length, 1);
  var rStep = (maxR - minR) / (nShells > 1 ? (nShells - 1) : 1);

  return (
    <div style={{ display:"flex",flexDirection:"column",alignItems:"center",margin:"6px 0 10px" }}>
      <svg width={size} height={size} viewBox={"0 0 "+size+" "+size} style={{ background:"radial-gradient(circle at center,rgba(0,230,118,.08),transparent 75%)",borderRadius:12 }}>
        {/* Glowing Nucleus */}
        <circle cx={cx} cy={cy} r="14" fill="#ff6d00" opacity="0.25">
          <animate attributeName="r" values="13;15.5;13" dur="2s" repeatCount="indefinite" />
        </circle>
        <circle cx={cx} cy={cy} r="11" fill="#ff6d00" stroke="#ffab00" strokeWidth="1" />
        <text x={cx} y={cy+3.5} textAnchor="middle" fontSize="9" fontWeight="900" fill="#fff" fontFamily="inherit">{el.s}</text>

        {/* Orbit Tracks & Electrons */}
        {shells.map(function(eCount, sIdx) {
          var r = nShells === 1 ? 44 : minR + sIdx * rStep;
          var dur = (sIdx + 1) * 3 + "s";
          var isValence = sIdx === shells.length - 1;
          var eColor = isValence ? "#00e676" : "#40c4ff";
          var angles = [];
          for (var i = 0; i < eCount; i++) angles.push((i / eCount) * 2 * Math.PI);

          return (
            <g key={sIdx}>
              <circle cx={cx} cy={cy} r={r} fill="none" stroke={T.isLight ? "rgba(0,0,0,.15)" : "rgba(255,255,255,.12)"} strokeWidth="1" strokeDasharray={isValence ? "3,3" : "none"} />
              <g style={{ transformOrigin: cx+"px "+cy+"px", animation: "spin "+dur+" linear infinite" }}>
                {angles.map(function(ang, aIdx) {
                  var ex = cx + r * Math.cos(ang);
                  var ey = cy + r * Math.sin(ang);
                  return (
                    <circle key={aIdx} cx={ex} cy={ey} r={isValence ? 3.2 : 2.6} fill={eColor} stroke="#000" strokeWidth="0.5" />
                  );
                })}
              </g>
            </g>
          );
        })}
      </svg>
      {/* Shell labels readout */}
      <div style={{ display:"flex",gap:4,marginTop:4,flexWrap:"wrap",justifyContent:"center" }}>
        {shells.map(function(cnt, idx) {
          var isV = idx === shells.length - 1;
          return (
            <span key={idx} style={{ fontSize:9,fontWeight:700,padding:"2px 5px",borderRadius:4,background:isV?"rgba(0,230,118,.15)":T.surfaceAlt,color:isV?"#00e676":T.textDim,border:"1px solid "+(isV?"rgba(0,230,118,.4)":T.borderSoft) }}>
              {SHELL_LABELS[idx]||("S"+(idx+1))}: {cnt}
            </span>
          );
        })}
      </div>
    </div>
  );
}

      var raw = localStorage.getItem("labcraft_mastered_elements");
      return raw ? JSON.parse(raw) : {};
    } catch(e) { return {}; }
  });

  var deck = useMemo(function() {
    if (catFilter === "All") return EL;
    return EL.filter(function(e) { return e.cat === catFilter; });
  }, [catFilter]);

  var current = deck[idx] || EL[0];
  var isMastered = !!mastered[current.n];
  var totalMastered = Object.keys(mastered).length;
  var pct = Math.round((totalMastered / EL.length) * 100);

  function toggleMastered(e) {
    if (e) e.stopPropagation();
    var next = { ...mastered };
    if (next[current.n]) {
      delete next[current.n];
    } else {
      next[current.n] = true;
      try { playBeep("achievement"); } catch(err){}
    }
    setMastered(next);
    try { localStorage.setItem("labcraft_mastered_elements", JSON.stringify(next)); } catch(err){}
  }

  function nextCard() {
    setFlipped(false);
    setIdx(function(i) { return (i + 1) % deck.length; });
    try { playBeep("tick"); } catch(e){}
  }

  function prevCard() {
    setFlipped(false);
    setIdx(function(i) { return (i - 1 + deck.length) % deck.length; });
    try { playBeep("tick"); } catch(e){}
  }

  function shuffleCards() {
    setFlipped(false);
    setIdx(Math.floor(Math.random() * deck.length));
    try { playBeep("whoosh"); } catch(e){}
  }

  var catCol = CC[current.cat] || "#40c4ff";

  return (
    <div style={{ position:"fixed",inset:0,background:"rgba(0,0,0,.88)",zIndex:150,display:"flex",alignItems:"center",justifyContent:"center",padding:16 }} onClick={onClose}>
      <div onClick={function(e){e.stopPropagation()}} style={{ background:T.isLight?"#fff":"#0d1117",border:"2px solid "+catCol,borderRadius:16,padding:16,maxWidth:360,width:"100%",maxHeight:"90vh",overflowY:"auto" }}>
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8 }}>
          <div>
            <div style={{ fontSize:13,fontWeight:900,color:"#ffd700",letterSpacing:1 }}>🗂️ ELEMENT FLASHCARDS</div>
            <div style={{ fontSize:10,color:T.textDim,marginTop:1 }}>
              Card {idx + 1} / {deck.length} • Mastered: <strong style={{ color:"#00e676" }}>{totalMastered}/118 ({pct}%)</strong>
            </div>
          </div>
          <button onClick={onClose} style={{ background:T.surfaceAlt,border:"none",borderRadius:8,width:28,height:28,color:T.textDim,fontSize:16,cursor:"pointer" }}>✕</button>
        </div>

        <div style={{ height:4,borderRadius:2,background:T.surfaceAlt,marginBottom:10,overflow:"hidden" }}>
          <div style={{ height:"100%",background:"linear-gradient(90deg,#00e676,#40c4ff)",width:pct+"%",transition:"width 0.3s ease" }} />
        </div>

        <div style={{ display:"flex",gap:4,overflowX:"auto",paddingBottom:6,marginBottom:8 }}>
          {["All"].concat(Object.keys(CC)).map(function(c) {
            var on = catFilter === c;
            var col = c === "All" ? "#ffd700" : CC[c];
            return (
              <button
                key={c}
                onClick={function(){setCatFilter(c);setIdx(0);setFlipped(false);}}
                style={{
                  padding:"3px 8px",borderRadius:10,fontSize:9,fontWeight:800,fontFamily:"inherit",cursor:"pointer",whiteSpace:"nowrap",
                  background:on ? (col+"25") : T.surfaceAlt,
                  border:"1px solid "+(on ? col : T.borderSoft),
                  color:on ? col : T.textDim
                }}
              >
                {c}
              </button>
            );
          })}
        </div>

        <div
          onClick={function(){setFlipped(!flipped);try{playBeep("tick")}catch(e){}}}
          style={{
            minHeight:240,borderRadius:14,cursor:"pointer",position:"relative",
            background:T.isLight?"linear-gradient(135deg,#f8fafc,#edf2f7)":"linear-gradient(135deg,#131929,#090d16)",
            border:"2px solid "+(isMastered ? "#00e676" : catCol+"66"),
            boxShadow:"0 8px 24px rgba(0,0,0,.25)",padding:18,
            display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
            textAlign:"center",transition:"all 0.3s cubic-bezier(.4,0,.2,1)"
          }}
        >
          <button
            onClick={toggleMastered}
            style={{
              position:"absolute",top:12,right:12,background:isMastered?"rgba(0,230,118,.2)":T.surfaceAlt,
              border:"1px solid "+(isMastered?"#00e676":T.borderSoft),borderRadius:8,padding:"4px 8px",
              cursor:"pointer",fontSize:11,fontWeight:800,color:isMastered?"#00e676":T.textDim
            }}
          >
            {isMastered ? "⭐ Mastered ✓" : "☆ Learn"}
          </button>

          {!flipped ? (
            <div style={{ width:"100%" }}>
              <div style={{ fontSize:13,fontWeight:700,color:T.textDim }}>#{current.n}</div>
              <div style={{ fontSize:64,fontWeight:900,color:catCol,lineHeight:1.1,textShadow:"0 0 16px "+catCol+"55" }}>
                {current.s}
              </div>
              <div style={{ fontSize:11,fontWeight:800,display:"inline-block",padding:"3px 10px",borderRadius:6,background:catCol+"22",color:catCol,marginTop:8 }}>
                {current.cat}
              </div>
              <div style={{ fontSize:10,color:T.textDim,marginTop:18,fontStyle:"italic" }}>
                👆 Tap card to flip & reveal properties
              </div>
            </div>
          ) : (
            <div style={{ width:"100%" }}>
              <div style={{ fontSize:22,fontWeight:900,color:T.text }}>{current.name}</div>
              <div style={{ fontSize:12,color:catCol,fontWeight:800,marginTop:2 }}>{current.s} • #{current.n}</div>

              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,margin:"12px 0 10px",textAlign:"left" }}>
                <div style={{ background:T.surfaceAlt,padding:"5px 8px",borderRadius:6 }}>
                  <div style={{ fontSize:8,color:T.textDim,fontWeight:700 }}>ATOMIC MASS</div>
                  <div style={{ fontSize:11,fontWeight:800,color:T.text }}>{current.m} u</div>
                </div>
                <div style={{ background:T.surfaceAlt,padding:"5px 8px",borderRadius:6 }}>
                  <div style={{ fontSize:8,color:T.textDim,fontWeight:700 }}>CONFIG</div>
                  <div style={{ fontSize:10,fontWeight:800,color:T.text }}>{current.config}</div>
                </div>
                <div style={{ background:T.surfaceAlt,padding:"5px 8px",borderRadius:6 }}>
                  <div style={{ fontSize:8,color:T.textDim,fontWeight:700 }}>DENSITY</div>
                  <div style={{ fontSize:11,fontWeight:800,color:T.text }}>{current.d} g/cm³</div>
                </div>
                <div style={{ background:T.surfaceAlt,padding:"5px 8px",borderRadius:6 }}>
                  <div style={{ fontSize:8,color:T.textDim,fontWeight:700 }}>MELTING PT</div>
                  <div style={{ fontSize:11,fontWeight:800,color:T.text }}>{current.mp!=null&&current.mp!==-1?current.mp+"°C":"?"}</div>
                </div>
              </div>

              <div style={{ background:"rgba(255,215,0,.06)",border:"1px solid rgba(255,215,0,.2)",borderRadius:8,padding:8,textAlign:"left" }}>
                <div style={{ fontSize:9,color:"#ffd700",fontWeight:800 }}>DID YOU KNOW?</div>
                <div style={{ fontSize:11,color:T.text,marginTop:2,lineHeight:1.3 }}>{current.fact}</div>
              </div>
            </div>
          )}
        </div>

        <div style={{ display:"flex",gap:6,marginTop:12 }}>
          <button
            onClick={prevCard}
            style={{ flex:1,padding:10,borderRadius:8,background:T.surfaceAlt,border:"1px solid "+T.borderSoft,color:T.text,fontWeight:800,fontSize:12,cursor:"pointer",fontFamily:"inherit" }}
          >
            ⬅ Prev
          </button>
          <button
            onClick={shuffleCards}
            style={{ padding:"10px 14px",borderRadius:8,background:T.surfaceAlt,border:"1px solid "+T.borderSoft,color:"#40c4ff",fontWeight:800,fontSize:12,cursor:"pointer",fontFamily:"inherit" }}
          >
            🔀 Shuffle
          </button>
          <button
            onClick={nextCard}
            style={{ flex:1,padding:10,borderRadius:8,background:"linear-gradient(135deg,#00e676,#00b248)",border:"none",color:"#000",fontWeight:900,fontSize:12,cursor:"pointer",fontFamily:"inherit" }}
          >
            Next ➡
          </button>
        </div>
      </div>
    </div>
  );
}

    ]
  }
];

function getMnemonicForElement(atomicNum) {
  for (var i = 0; i < DESI_MNEMONICS.length; i++) {
    var g = DESI_MNEMONICS[i];
    for (var j = 0; j < g.items.length; j++) {
      if (g.items[j].n === atomicNum) {
        return {
          groupId: g.id,
          groupTitle: g.group,
          hindi: g.hindi,
          english: g.english,
          tip: g.tip,
          elementWord: g.items[j].word,
          item: g.items[j],
          color: g.color,
          items: g.items
        };
      }
    }
  }
  return null;
}

function shareElementTrick(el, m) {
  if (!m) m = getMnemonicForElement(el.n);

}



/* ═══ DESI MNEMONICS & TRICKS MODAL (VIRAL NEET/JEE) ═══ */
function DesiMnemonicsModal(props) {
  var T = props.T || themeStyles("dark");
  var onClose = props.onClose;
  var onSelectElement = props.onSelectElement;

  var [tab, setTab] = useState("browse"); // "browse" or "quiz"
  var [blockFilter, setBlockFilter] = useState("All");
  var [search, setSearch] = useState("");
  var [toast, setToast] = useState(null);
  var toastTimer = useRef(null);

  function triggerToast(msg) {
    setToast(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(function() { setToast(null); }, 2500);
  }

  // Quiz Engine
  var [quizRound, setQuizRound] = useState(0);
  var [quizQuestions, setQuizQuestions] = useState([]);
  var [qIdx, setQIdx] = useState(0);
  var [selectedAns, setSelectedAns] = useState(null);
  var [isAnswered, setIsAnswered] = useState(false);
  var [score, setScore] = useState(0);
  var [streak, setStreak] = useState(0);
  var [isFinished, setIsFinished] = useState(false);

  function buildQuiz() {
    var questions = [];
    var shuffledGroups = DESI_MNEMONICS.slice().sort(function() { return 0.5 - Math.random(); });
    for (var i = 0; i < Math.min(5, shuffledGroups.length); i++) {
      var g = shuffledGroups[i];
      var it = g.items[Math.floor(Math.random() * g.items.length)];
      var el = EL.find(function(e) { return e.n === it.n; }) || { s: it.s, name: it.name, n: it.n };
      
      // 3 random distractors
      var distractors = [];
      var used = {};
      used[it.n] = true;
      while (distractors.length < 3) {
        var r = EL[Math.floor(Math.random() * EL.length)];
        if (!used[r.n]) {
          used[r.n] = true;
          distractors.push(r.s + " - " + r.name + " (#" + r.n + ")");
        }
      }
      var correctStr = el.s + " - " + el.name + " (#" + el.n + ")";
      var allOpts = distractors.concat([correctStr]).sort(function() { return 0.5 - Math.random(); });
      var correctIdx = allOpts.indexOf(correctStr);

      questions.push({
        groupTitle: g.group,
        hindi: g.hindi,
        word: it.word,
        el: el,
        options: allOpts,
        correctIdx: correctIdx,
        tip: g.tip
      });
    }
    setQuizQuestions(questions);
    setQIdx(0);
    setSelectedAns(null);
    setIsAnswered(false);
    setScore(0);
    setStreak(0);
    setIsFinished(false);
    setQuizRound(function(r) { return r + 1; });
  }

  useEffect(function() {
    if (tab === "quiz" && quizQuestions.length === 0) {
      buildQuiz();
    }
  }, [tab]);

  function handleAnswer(optIdx) {
    if (isAnswered) return;
    setSelectedAns(optIdx);
    setIsAnswered(true);
    var q = quizQuestions[qIdx];
    if (optIdx === q.correctIdx) {
      setScore(function(s) { return s + 1; });
      setStreak(function(st) { return st + 1; });
      playBeep("achievement");
      triggerHaptic("achievement");
    } else {
      setStreak(0);
      playBeep("plop");
      triggerHaptic("tick");
    }
  }

  function handleNextQuestion() {
    if (qIdx + 1 < quizQuestions.length) {
      setQIdx(qIdx + 1);
      setSelectedAns(null);
      setIsAnswered(false);
      playBeep("tick");
    } else {
      setIsFinished(true);
      playBeep("mole_celebration");
      triggerHaptic("achievement");
    }
  }

  var filteredMnemonics = useMemo(function() {
    return DESI_MNEMONICS.filter(function(m) {
      if (blockFilter !== "All" && m.block !== blockFilter) return false;
      if (search) {
        var s = search.toLowerCase();
        var matchGroup = m.group.toLowerCase().indexOf(s) !== -1;
        var matchHindi = m.hindi.toLowerCase().indexOf(s) !== -1;
        var matchEng = m.english.toLowerCase().indexOf(s) !== -1;
        var matchItem = m.items.some(function(it) {
          return it.word.toLowerCase().indexOf(s) !== -1 ||
                 it.s.toLowerCase().indexOf(s) !== -1 ||
                 it.name.toLowerCase().indexOf(s) !== -1 ||
                 String(it.n) === s;
        });
        return matchGroup || matchHindi || matchEng || matchItem;
      }
      return true;
    });
  }, [blockFilter, search]);

  var BLOCKS = ["All", "s-block", "p-block", "d-block", "f-block", "Periods"];

/* ═══ MOLAR MASS CALCULATOR COMPONENT ═══ */
function parseChemicalFormula(formula) {
  formula = (formula || "").trim().replace(/\s+/g, "");
  if (!formula) return null;
  var parts = formula.split(/[\.·\*]/);
  var counts = {};

  function parsePart(str, multiplier) {
    multiplier = multiplier || 1;
    var stack = [{}];
    var i = 0;
    while (i < str.length) {
      var ch = str[i];
      if (ch === '(' || ch === '[') {
        stack.push({});
        i++;
      } else if (ch === ')' || ch === ']') {
        i++;
        var numStr = "";
        while (i < str.length && /\d/.test(str[i])) {
          numStr += str[i];
          i++;
        }
        var groupMult = numStr ? parseInt(numStr, 10) : 1;
        var top = stack.pop();
        var current = stack[stack.length - 1];
        if (top) {
          for (var el in top) {
            current[el] = (current[el] || 0) + top[el] * groupMult;
          }
        }
      } else if (/[A-Z]/.test(ch)) {
        var elName = ch;
        i++;
        if (i < str.length && /[a-z]/.test(str[i])) {
          elName += str[i];
          i++;
        }
        var countStr = "";
        while (i < str.length && /\d/.test(str[i])) {
          countStr += str[i];
          i++;
        }
        var elCount = countStr ? parseInt(countStr, 10) : 1;
        var cur = stack[stack.length - 1];
        cur[elName] = (cur[elName] || 0) + elCount;
      } else {
        i++;
      }
    }
    var res = stack[0];
    for (var k in res) {
      counts[k] = (counts[k] || 0) + res[k] * multiplier;
    }
  }

  var m0 = parts[0].match(/^(\d+)(.*)/);
  if (m0) {
    parsePart(m0[2], parseInt(m0[1], 10));
  } else {
    parsePart(parts[0], 1);
  }

  for (var p = 1; p < parts.length; p++) {
    var mp = parts[p].match(/^(\d+)?(.*)/);
    if (mp) {
      var mult = mp[1] ? parseInt(mp[1], 10) : 1;
      parsePart(mp[2] || "H2O", mult);
    }
  }

  var massMap = {};
  EL.forEach(function(e) { massMap[e.s] = e; });

  var totalMass = 0;
  var breakdown = [];
  for (var symb in counts) {
    var elInfo = massMap[symb];
    if (!elInfo) return { error: "Unknown element: " + symb };
    var elemTotalMass = counts[symb] * elInfo.m;
    totalMass += elemTotalMass;
    breakdown.push({
      symbol: symb,
      name: elInfo.name,
      cat: elInfo.cat,
      count: counts[symb],
      singleMass: elInfo.m,
      totalElemMass: elemTotalMass
    });
  }

  if (totalMass === 0) return null;

  breakdown.forEach(function(b) {
    b.percent = (b.totalElemMass / totalMass) * 100;
  });

  breakdown.sort(function(a, b) { return b.totalElemMass - a.totalElemMass; });

  return {
    formula: formula,
    totalMass: totalMass,
    breakdown: breakdown
  };
}

function MolarMassCalc(props) {
  var T = props.T;
  var [formula, setFormula] = useState("H2SO4");
  var presets = ["H2O","NaCl","H2SO4","Ca(OH)2","CaCO3","C6H12O6","KMnO4","(NH4)2SO4","CuSO4*5H2O","NaHCO3"];

  var result = useMemo(function() {
    return parseChemicalFormula(formula);
  }, [formula]);

  return (
    <div style={{ padding:14,maxWidth:420,margin:"0 auto" }}>
      <div style={{ textAlign:"center",marginBottom:12 }}>
        <h2 style={{ fontSize:18,fontWeight:900,color:"#00e676",letterSpacing:1 }}>⚖️ MOLAR MASS CALCULATOR</h2>
        <p style={{ fontSize:11,color:T.textDim,marginTop:2 }}>Enter any chemical formula or hydrate to calculate molecular weight and mass percent.</p>
      </div>

      <div style={{ display:"flex",gap:6,marginBottom:10 }}>
        <input
          value={formula}
          onChange={function(e){setFormula(e.target.value)}}
          placeholder="e.g. H2SO4, Ca(OH)2..."

/* ═══ EQUATION BALANCER ═══ */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a; }
function lcm(a, b) { if (!a || !b) return 0; return Math.abs(a * b) / (gcd(a, b) || 1); }

function Frac(n, d) {
  d = d || 1;
  if (d < 0) { n = -n; d = -d; }
  var g = gcd(n, d) || 1;
  this.n = Math.round(n / g);
  this.d = Math.round(d / g);
}
Frac.prototype.add = function(f) { return new Frac(this.n * f.d + f.n * this.d, this.d * f.d); };
Frac.prototype.sub = function(f) { return new Frac(this.n * f.d - f.n * this.d, this.d * f.d); };
Frac.prototype.mul = function(f) { return new Frac(this.n * f.n, this.d * f.d); };
Frac.prototype.div = function(f) { return new Frac(this.n * f.d, this.d * f.n); };
Frac.prototype.isZero = function() { return this.n === 0; };

function parseCompoundMap(str) {
  var stack = [{}];
  var i = 0;
  while (i < str.length) {
    var ch = str[i];
    if (ch === '(' || ch === '[') { stack.push({}); i++; }
    else if (ch === ')' || ch === ']') {
      i++;
      var n = '';
      while (i < str.length && /\d/.test(str[i])) { n += str[i]; i++; }
      var mult = n ? parseInt(n, 10) : 1;
      var top = stack.pop();
      var cur = stack[stack.length - 1];
      if (top) { for (var k in top) cur[k] = (cur[k] || 0) + top[k] * mult; }
    } else if (/[A-Z]/.test(ch)) {
      var el = ch; i++;
      if (i < str.length && /[a-z]/.test(str[i])) { el += str[i]; i++; }
      var n2 = '';
      while (i < str.length && /\d/.test(str[i])) { n2 += str[i]; i++; }
      var count = n2 ? parseInt(n2, 10) : 1;
      var cur2 = stack[stack.length - 1];
      cur2[el] = (cur2[el] || 0) + count;
    } else { i++; }
  }
  return stack[0];
}

function balanceChemicalEquation(eqStr) {
  if (!eqStr) return null;
  var parts = eqStr.split(/->|=|→/);
  if (parts.length !== 2) return { error: "Include '->' or '=' between reactants and products" };
  var left = parts[0].split('+').map(function(s){return s.trim()}).filter(Boolean);
  var right = parts[1].split('+').map(function(s){return s.trim()}).filter(Boolean);
  if (!left.length || !right.length) return { error: "Enter both reactants and products" };

  var allCompounds = left.concat(right);
  var nComp = allCompounds.length;
  var parsed = allCompounds.map(parseCompoundMap);

  var elements = [];
  for (var i = 0; i < parsed.length; i++) {
    for (var el in parsed[i]) {
      if (elements.indexOf(el) === -1) elements.push(el);
    }
  }

  var M = [];
  for (var e = 0; e < elements.length; e++) {
    var elem = elements[e];
    var row = [];
    for (var j = 0; j < nComp; j++) {
      var count = parsed[j][elem] || 0;
      var sign = j < left.length ? 1 : -1;
      row.push(new Frac(sign * count, 1));
    }
    M.push(row);
  }

  var nRows = M.length;
  var nCols = nComp;
  var lead = 0;
  for (var r = 0; r < nRows; r++) {
    if (lead >= nCols) break;
    var iRow = r;
    while (M[iRow][lead].isZero()) {
      iRow++;
      if (iRow === nRows) {
        iRow = r;
        lead++;
        if (lead === nCols) break;
      }
    }
    if (lead === nCols) break;
    var temp = M[iRow]; M[iRow] = M[r]; M[r] = temp;
    var lv = M[r][lead];
    for (var j2 = 0; j2 < nCols; j2++) M[r][j2] = M[r][j2].div(lv);
    for (var i2 = 0; i2 < nRows; i2++) {
      if (i2 !== r) {
        var factor = M[i2][lead];
        if (!factor.isZero()) {
          for (var j3 = 0; j3 < nCols; j3++) {
            M[i2][j3] = M[i2][j3].sub(factor.mul(M[r][j3]));
          }
        }
      }
    }
    lead++;
  }

  var solution = new Array(nCols);
  for (var si = 0; si < nCols; si++) solution[si] = null;
  solution[nCols - 1] = new Frac(1, 1);
  for (var r2 = nRows - 1; r2 >= 0; r2--) {
    var leadCol = -1;
    for (var c = 0; c < nCols - 1; c++) {
      if (!M[r2][c].isZero()) { leadCol = c; break; }
    }
    if (leadCol !== -1) {
      var val = new Frac(0, 1);
      for (var c2 = leadCol + 1; c2 < nCols; c2++) {
        val = val.sub(M[r2][c2].mul(solution[c2]));
      }
      solution[leadCol] = val;
    }
  }

  for (var sIdx = 0; sIdx < nCols; sIdx++) {
    if (!solution[sIdx]) solution[sIdx] = new Frac(1, 1);
  }

  var allPos = solution.every(function(f){return f.n > 0});
  if (!allPos) {
    var allNeg = solution.every(function(f){return f.n < 0});
    if (allNeg) solution = solution.map(function(f){return new Frac(-f.n, f.d)});
    else return { error: "Could not find integer stoichiometric balance" };
  }

  var overallLCM = 1;
  for (var li = 0; li < solution.length; li++) overallLCM = lcm(overallLCM, solution[li].d);
  var intCoeffs = solution.map(function(f){return f.n * (overallLCM / f.d)});

  var commonGCD = intCoeffs[0];
  for (var ci = 0; ci < intCoeffs.length; ci++) commonGCD = gcd(commonGCD, intCoeffs[ci]);
  intCoeffs = intCoeffs.map(function(c){return c / commonGCD});

  var leftStr = left.map(function(c, i){ return (intCoeffs[i] > 1 ? intCoeffs[i] : '') + c; }).join(' + ');
  var rightStr = right.map(function(c, i){
    var coeff = intCoeffs[left.length + i];
    return (coeff > 1 ? coeff : '') + c;
  }).join(' + ');

  var tally = elements.map(function(el) {
    var lCount = 0, rCount = 0;
    for (var i = 0; i < left.length; i++) lCount += (parsed[i][el] || 0) * intCoeffs[i];
    for (var j = 0; j < right.length; j++) rCount += (parsed[left.length + j][el] || 0) * intCoeffs[left.length + j];
    return { element: el, left: lCount, right: rCount };
  });

  return {
    balanced: leftStr + " -> " + rightStr,
    coeffs: intCoeffs,
    tally: tally
  };
}

      <div style={{ display:"flex",gap:4,flexWrap:"wrap",marginBottom:14 }}>

        <div style={{ background:T.surfaceAlt,borderRadius:12,border:"1px solid "+T.headerBorder,padding:14 }}>

            <div style={{ fontSize:16,fontWeight:900,color:T.text,margin:"8px 0",lineHeight:1.4 }}>{result.balanced}</div>
          </div>

          <div style={{ marginTop:12 }}>
            <div style={{ fontSize:11,color:T.textDim,fontWeight:700,marginBottom:6 }}>ATOM AUDIT TALLY</div>
            <div style={{ display:"grid",gridTemplateColumns:"repeat(3, 1fr)",gap:6 }}>

/* ═══ ACID-BASE TITRATION SIMULATOR ═══ */
function calcTitrationPH(volAdded) {
  var v = Math.max(0, Math.min(50, volAdded));
  var initialMolesH = 20.0 * 1e-4; // 20 mL * 0.1 M = 0.0020 mol
  var addedMolesOH = v * 1e-4;     // v mL * 0.1 M
  var totalVolL = (20.0 + v) * 0.001;

  if (Math.abs(v - 20.0) < 0.05) {
    return 7.00;
  }
  if (v < 20.0) {
    var unreactedH = initialMolesH - addedMolesOH;
    var concH = unreactedH / totalVolL;
    var ph = -Math.log10(concH);
    return Math.max(1.0, Math.min(6.95, Math.round(ph * 100) / 100));
  } else {
    var excessOH = addedMolesOH - initialMolesH;
    var concOH = excessOH / totalVolL;
    var poh = -Math.log10(concOH);
    var ph = 14.0 - poh;
    return Math.max(7.05, Math.min(13.0, Math.round(ph * 100) / 100));
  }
}

function getIndicatorColor(indicator, ph) {
  if (indicator === "phenol") {
    if (ph < 8.2) return "rgba(255,255,255,0.08)";
    if (ph < 8.7) return "rgba(255,182,193,0.65)";
    if (ph < 10.0) return "rgba(240,98,146,0.85)";
    return "rgba(216,27,96,0.92)";
  }
  if (indicator === "methyl") {
    if (ph < 3.2) return "rgba(229,57,53,0.85)";
    if (ph < 4.4) return "rgba(251,140,0,0.85)";
    return "rgba(253,216,53,0.85)";
  }
  if (ph <= 2) return "rgba(211,47,47,0.9)";
  if (ph <= 4) return "rgba(251,140,0,0.9)";
  if (ph <= 6) return "rgba(253,216,53,0.9)";
  if (ph <= 8) return "rgba(67,160,71,0.9)";
  if (ph <= 10) return "rgba(30,136,229,0.9)";
  return "rgba(123,31,162,0.9)";
}

function TitrationApparatus(props) {
  var vol = props.vol;
  var ph = props.ph;
  var color = props.color;
  var isDripping = props.isDripping;
  var stirrerOn = props.stirrerOn;

function TitrationCurveGraph(props) {
  var history = props.history;
  var currentVol = props.currentVol;
  var currentPH = props.currentPH;
  var T = props.T;

  var W = 300, H = 110;
  var pad = { l:28, r:10, t:10, b:20 };
  var iw = W - pad.l - pad.r;
  var ih = H - pad.t - pad.b;

  function px(v) { return pad.l + (v / 40.0) * iw; }
  function py(ph) { return pad.t + ih - (ph / 14.0) * ih; }

  var pathD = "";
  if (history && history.length > 0) {
    pathD = history.map(function(pt, i) {
      return (i === 0 ? "M " : "L ") + px(pt.v) + " " + py(pt.ph);
    }).join(" ");
  }

  return (
    <div style={{ background:T.surfaceAlt,borderRadius:10,padding:"8px 10px",margin:"10px 0 0",border:"1px solid "+T.borderSoft }}>
      <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4 }}>
        <div style={{ fontSize:10,fontWeight:800,letterSpacing:1,color:"#40c4ff" }}>TITRATION CURVE (pH vs V_NaOH)</div>
        <div style={{ fontSize:11,fontWeight:900,color:currentPH>=7?"#00e676":"#ff5252" }}>
          pH {currentPH.toFixed(2)} • {currentVol.toFixed(1)} mL
        </div>
      </div>

      <svg width="100%" height={H} viewBox={"0 0 "+W+" "+H} preserveAspectRatio="xMidYMid meet">
        <line x1={pad.l} y1={py(7)} x2={W-pad.r} y2={py(7)} stroke="rgba(0,230,118,0.3)" strokeDasharray="3,3" strokeWidth="0.8" />
        <text x={pad.l-3} y={py(7)+3} fontSize="7" fill="#00e676" textAnchor="end" fontFamily="inherit">7.0</text>

        <text x={pad.l-3} y={pad.t+6} fontSize="7" fill={T.textDim} textAnchor="end" fontFamily="inherit">14</text>
        <text x={pad.l-3} y={pad.t+ih} fontSize="7" fill={T.textDim} textAnchor="end" fontFamily="inherit">0</text>

        <line x1={px(20)} y1={pad.t} x2={px(20)} y2={pad.t+ih} stroke="rgba(255,215,0,0.35)" strokeDasharray="2,2" strokeWidth="0.8" />
        <text x={px(20)} y={pad.t+ih+14} fontSize="7" fill="#ffd700" textAnchor="middle" fontFamily="inherit">20 mL (Eq)</text>

        {[0, 10, 20, 30, 40].map(function(v) {
          if (v === 20) return null;
          return (
            <text key={v} x={px(v)} y={pad.t+ih+14} fontSize="7" fill={T.textDim} textAnchor="middle" fontFamily="inherit">{v}</text>
          );
        })}

        {pathD && (
          <path d={pathD} fill="none" stroke="#40c4ff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
        )}

        <circle cx={px(Math.min(40, currentVol))} cy={py(currentPH)} r="3.5" fill="#ff1744" stroke="#fff" strokeWidth="1">
          <animate attributeName="r" values="3.5;5;3.5" dur="1s" repeatCount="indefinite" />
        </circle>
      </svg>
    </div>
  );
}

function TitrationView(props) {
  var T = props.T;
  var [vol, setVol] = useState(0.0);
  var [indicator, setIndicator] = useState("phenol");
  var [isDripping, setIsDripping] = useState(false);
  var [stirrerOn, setStirrerOn] = useState(true);
  var [history, setHistory] = useState(function() {
    return [{ v: 0.0, ph: calcTitrationPH(0.0) }];
  });
  var [evaluation, setEvaluation] = useState(null);

  var ph = calcTitrationPH(vol);
  var color = getIndicatorColor(indicator, ph);

  useEffect(function() {
    if (!isDripping) return;
    var timer = setInterval(function() {
      setVol(function(prev) {
        if (prev >= 40.0) {
          setIsDripping(false);
          return 40.0;
        }
        var next = Math.round((prev + 0.5) * 10) / 10;
        var nextPH = calcTitrationPH(next);
        setHistory(function(h) { return h.concat({ v: next, ph: nextPH }); });
        try { playBeep("plop"); } catch(e){}
        return next;
      });
    }, 280);
    return function() { clearInterval(timer); };
  }, [isDripping]);

  function addVolume(amount) {
    if (vol >= 40.0) return;
    var next = Math.round((vol + amount) * 10) / 10;
    if (next > 40.0) next = 40.0;
    setVol(next);
    var nextPH = calcTitrationPH(next);
    setHistory(function(h) { return h.concat({ v: next, ph: nextPH }); });
    try { playBeep("plop"); } catch(e){}
  }

  function resetTitration() {
    setIsDripping(false);
    setVol(0.0);
    setEvaluation(null);
    setHistory([{ v: 0.0, ph: calcTitrationPH(0.0) }]);
    try { playBeep("tick"); } catch(e){}
  }

  function evaluateTitration() {
    setIsDripping(false);
    var diff = Math.abs(vol - 20.0);
    if (diff <= 0.3) {
      try { playBeep("achievement"); } catch(e){}
      setEvaluation({
        grade: "A+ MASTER TITRATOR!",
        color: "#00e676",
        msg: "Perfection! You caught the exact persistent faint-pink equivalence point at " + vol.toFixed(1) + " mL (Error: ±" + ((diff/20)*100).toFixed(1) + "%). Stoichiometric moles HCl = NaOH!"
      });
    } else if (diff <= 1.0) {
      try { playBeep("achievement"); } catch(e){}
      setEvaluation({
        grade: "GRADE B: VERY GOOD",
        color: "#40c4ff",
        msg: "Close titration! Stopped at " + vol.toFixed(1) + " mL (Target: 20.0 mL). Minor overshoot/undershoot."
      });
    } else if (vol < 19.0) {
      try { playBeep("plop"); } catch(e){}
      setEvaluation({
        grade: "UNDER-TITRATED (ACIDIC)",
        color: "#ffd600",
        msg: "Stopped too early at " + vol.toFixed(1) + " mL. Still excess H+ in flask (pH " + ph.toFixed(1) + "). Add more base."
      });
    } else {
      try { playBeep("plop"); } catch(e){}
      setEvaluation({
        grade: "OVER-TITRATED (DARK PINK)",
        color: "#ff5252",
        msg: "Overshot endpoint at " + vol.toFixed(1) + " mL! The solution turned dark magenta from excess OH- ions."
      });
    }
  }

  return (
    <div style={{ padding:"10px 12px 24px" }}>
      <div style={{ display:"flex",alignItems:"center",gap:4,marginBottom:8,overflowX:"auto" }}>
        <span style={{ fontSize:10,fontWeight:800,color:T.textDim,marginRight:4 }}>INDICATOR:</span>
        {[
          ["phenol", "Phenolphthalein", "#ea80fc"],
          ["methyl", "Methyl Orange", "#ff9800"],
          ["universal", "Universal Rainbow", "#00e676"]
        ].map(function(ind) {
          var on = indicator === ind[0];
          return (
            <button
              key={ind[0]}
              onClick={function(){setIndicator(ind[0]);playBeep("tick");}}
              style={{
                flex:1,padding:"5px 8px",borderRadius:12,fontSize:10,fontWeight:800,
                cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",
                background:on?(ind[2]+"22"):T.surfaceAlt,
                border:"1px solid "+(on?ind[2]:T.borderSoft),
                color:on?ind[2]:T.textDim
              }}
            >
              {ind[1]}
            </button>
          );
        })}
      </div>

      <TitrationApparatus
        vol={vol}
        ph={ph}
        color={color}
        isDripping={isDripping}
        stirrerOn={stirrerOn}
        T={T}
      />

      <div style={{ display:"flex",gap:6,margin:"8px 0" }}>
        <div style={{ flex:1,background:T.surfaceAlt,borderRadius:8,padding:"6px 8px",border:"1px solid "+T.borderSoft,textAlign:"center" }}>
          <div style={{ fontSize:9,color:T.textDim,fontWeight:700 }}>TITRANT ADDED</div>
          <div style={{ fontSize:15,fontWeight:900,color:"#40c4ff" }}>{vol.toFixed(1)} <span style={{ fontSize:10 }}>mL</span></div>
        </div>
        <div style={{ flex:1,background:T.surfaceAlt,borderRadius:8,padding:"6px 8px",border:"1px solid "+T.borderSoft,textAlign:"center" }}>
          <div style={{ fontSize:9,color:T.textDim,fontWeight:700 }}>SOLUTION pH</div>
          <div style={{ fontSize:15,fontWeight:900,color:ph>=8.2?"#ff4081":ph>=7?"#00e676":"#ff5252" }}>{ph.toFixed(2)}</div>
        </div>
        <div style={{ flex:1,background:T.surfaceAlt,borderRadius:8,padding:"6px 8px",border:"1px solid "+T.borderSoft,textAlign:"center" }}>
          <div style={{ fontSize:9,color:T.textDim,fontWeight:700 }}>ANALYTE</div>
          <div style={{ fontSize:12,fontWeight:800,color:T.text,marginTop:2 }}>20 mL HCl</div>
        </div>
      </div>

      <div style={{ display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4 }}>
        <button
          onClick={function(){addVolume(0.5)}}
          disabled={vol>=40.0}
          style={{ padding:"8px 2px",borderRadius:6,fontSize:11,fontWeight:800,cursor:"pointer",fontFamily:"inherit",background:T.surfaceAlt,border:"1px solid "+T.borderSoft,color:"#00e676" }}
        >
          +0.5 mL
        </button>
        <button
          onClick={function(){addVolume(1.0)}}
          disabled={vol>=40.0}
          style={{ padding:"8px 2px",borderRadius:6,fontSize:11,fontWeight:800,cursor:"pointer",fontFamily:"inherit",background:T.surfaceAlt,border:"1px solid "+T.borderSoft,color:"#40c4ff" }}
        >
          +1.0 mL
        </button>
        <button
          onClick={function(){setIsDripping(!isDripping);playBeep("tick");}}
          style={{ padding:"8px 2px",borderRadius:6,fontSize:11,fontWeight:800,cursor:"pointer",fontFamily:"inherit",background:isDripping?"rgba(255,23,68,.15)":"rgba(0,230,118,.15)",border:"1px solid "+(isDripping?"#ff5252":"#00e676"),color:isDripping?"#ff5252":"#00e676" }}
        >
          {isDripping ? "⏸ Pause" : "💧 Drip"}
        </button>
        <button
          onClick={resetTitration}
          style={{ padding:"8px 2px",borderRadius:6,fontSize:11,fontWeight:800,cursor:"pointer",fontFamily:"inherit",background:T.surfaceAlt,border:"1px solid "+T.borderSoft,color:T.textDim }}
        >
          🔄 Reset
        </button>
      </div>

      <div style={{ display:"flex",gap:4,marginTop:6 }}>
        <button
          onClick={function(){setStirrerOn(!stirrerOn);playBeep("tick");}}
          style={{ flex:1,padding:"7px",borderRadius:6,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",background:T.surfaceAlt,border:"1px solid "+T.borderSoft,color:stirrerOn?"#ffd700":T.textDim }}
        >
          {stirrerOn ? "🌀 Stirrer: ON" : "⚪ Stirrer: OFF"}
        </button>
        <button
          onClick={evaluateTitration}
          style={{ flex:1.5,padding:"7px",borderRadius:6,fontSize:11,fontWeight:900,cursor:"pointer",fontFamily:"inherit",background:"linear-gradient(135deg,#00e676,#00b248)",color:"#000",border:"none" }}
        >
          🎯 Check Endpoint!
        </button>
      </div>

      {evaluation && (
        <div style={{ marginTop:8,padding:10,borderRadius:8,background:evaluation.color+"14",border:"1.5px solid "+evaluation.color }}>
          <div style={{ fontSize:12,fontWeight:900,color:evaluation.color }}>{evaluation.grade}</div>
          <div style={{ fontSize:11,color:T.text,lineHeight:1.3,marginTop:3 }}>{evaluation.msg}</div>
        </div>
      )}

      <TitrationCurveGraph
        history={history}
        currentVol={vol}
        currentPH={ph}
        T={T}
      />
    </div>
  );
}

/* ─── FULL-SCREEN CELEBRATION CONFETTI ENGINE ─── */
function triggerConfettiBurst(originX, originY) {
  try {
    var canvas = document.getElementById("labcraft-confetti-canvas");
    if (!canvas) {
      canvas = document.createElement("canvas");
      canvas.id = "labcraft-confetti-canvas";
      canvas.style.position = "fixed";
      canvas.style.top = "0";
      canvas.style.left = "0";
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      canvas.style.pointerEvents = "none";
      canvas.style.zIndex = "999999";
      document.body.appendChild(canvas);
    }
    var ctx = canvas.getContext("2d");
    var w = canvas.width = window.innerWidth;
    var h = canvas.height = window.innerHeight;
    var colors = ["#00e676", "#00e5ff", "#ffd700", "#ff4081", "#7e57c2", "#ff9100", "#ffffff"];
    var particles = [];
    var ox = originX != null ? originX : w / 2;
    var oy = originY != null ? originY : h / 3;
    for (var i = 0; i < 95; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = Math.random() * 9 + 4;
      particles.push({
        x: ox,
        y: oy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3.5,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: Math.random() * 8 + 4,
        rot: Math.random() * 360,
        vr: (Math.random() - 0.5) * 14,
        life: 1,
        decay: Math.random() * 0.016 + 0.011
      });
    }
    function render() {
      ctx.clearRect(0, 0, w, h);
      var alive = false;
      for (var j = 0; j < particles.length; j++) {
        var p = particles[j];
        if (p.life > 0) {
          alive = true;
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.24;
          p.rot += p.vr;
          p.life -= p.decay;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.72);
          ctx.restore();
        }
      }
      if (alive) {
        requestAnimationFrame(render);
      } else {
        ctx.clearRect(0, 0, w, h);
        if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
      }
    }
    render();
  } catch(e) {}
}

/* ─── TAB 1: STUFFED MOLE STUDIO & DIY MAKER ─── */
function StuffedMoleStudio(props) {
  var T = props.T;
  var isLight = T.isLight;

  var [fur, setFur] = useState(function() {
    try {
      var saved = localStorage.getItem("labcraft_mole_custom_mascot");
      return saved ? JSON.parse(saved).fur : "brown";
    } catch(e) { return "brown"; }
  });
  var [costume, setCostume] = useState(function() {
    try {
      var saved = localStorage.getItem("labcraft_mole_custom_mascot");
      return saved ? JSON.parse(saved).costume : "coat";
    } catch(e) { return "coat"; }
  });
  var [eyewear, setEyewear] = useState(function() {
    try {
      var saved = localStorage.getItem("labcraft_mole_custom_mascot");
      return saved ? JSON.parse(saved).eyewear : "goggles";
    } catch(e) { return "goggles"; }
  });
  var [prop, setProp] = useState(function() {
    try {
      var saved = localStorage.getItem("labcraft_mole_custom_mascot");
      return saved ? JSON.parse(saved).prop : "flask";
    } catch(e) { return "flask"; }
  });
  var [name, setName] = useState(function() {
    try {
      var saved = localStorage.getItem("labcraft_mole_custom_mascot");
      return saved ? JSON.parse(saved).name : "Guaca-Mole";
    } catch(e) { return "Guaca-Mole"; }
  });
  var [toast, setToast] = useState("");

  var PUNS = [
    "Guaca-Mole", "Avogadro", "Sir Moles-a-Lot", "Holy Moley",
    "Iron Mole", "Rock 'n' Mole", "Mole-patra", "Doctor Mole-ecule",
    "Sherlock Moles", "Molar Bear"
  ];

  var FURS = [
    { id: "brown", label: "Classic Earth", hex: "#6d4c41" },
    { id: "white", label: "Lab Albino", hex: "#eceff1" },
    { id: "neon",  label: "Neon Chemist", hex: "#00e676" },
    { id: "pink",  label: "Cotton Candy", hex: "#f48fb1" },
    { id: "purple",label: "Cosmic Glow", hex: "#7e57c2" },
    { id: "gold",  label: "Golden Aurum", hex: "#ffd54f" }
  ];

  var COSTUMES = [
    { id: "coat", label: "🥼 Lab Coat" },
    { id: "super", label: "🦸 Super Mole" },
    { id: "wizard", label: "🧙 Wizard Cloak" },
    { id: "tiedye", label: "🌀 Tie-Dye Shirt" },
    { id: "tux", label: "👔 Gentle-Mole" },
    { id: "hoodie", label: "🧤 Cozy Hoodie" },
    { id: "none", label: "🧸 Pure Stuffed" }
  ];

  var EYEWEAR = [
    { id: "goggles", label: "🥽 Safety Goggles" },
    { id: "glasses", label: "👓 Wire Spectacles" },
    { id: "sunglasses", label: "🕶️ Cool Shades" },
    { id: "none", label: "✨ Big Sparkle Eyes" }
  ];

  var PROPS = [
    { id: "flask", label: "⚗️ Bubbling Flask" },
    { id: "number", label: "🔢 6.022x10²³ Sign" },
    { id: "scroll", label: "📜 Periodic Scroll" },
    { id: "test_tube", label: "🧪 Magic Tube" },
    { id: "marshmallow", label: "🍡 Marshmallow" },
    { id: "none", label: "🐾 Free Paws" }
  ];

  function showToastMsg(msg) {
    setToast(msg);
    setTimeout(function() { setToast(""); }, 2600);
  }

  function randomize() {
    playBeep("mole_squeak");
    var rf = FURS[Math.floor(Math.random() * FURS.length)].id;
    var rc = COSTUMES[Math.floor(Math.random() * COSTUMES.length)].id;
    var re = EYEWEAR[Math.floor(Math.random() * EYEWEAR.length)].id;
    var rp = PROPS[Math.floor(Math.random() * PROPS.length)].id;
    var rn = PUNS[Math.floor(Math.random() * PUNS.length)];
    setFur(rf); setCostume(rc); setEyewear(re); setProp(rp); setName(rn);
    triggerConfettiBurst();
  }

  function saveMascot() {
    try {
      var data = { fur: fur, costume: costume, eyewear: eyewear, prop: prop, name: name };
      localStorage.setItem("labcraft_mole_custom_mascot", JSON.stringify(data));
      localStorage.setItem("labcraft_mole_crafted", "true");
      playBeep("achievement");
      triggerConfettiBurst();
      showToastMsg("✨ Saved as your official Lab Mascot!");
      maybeShowInterstitial(false);
    } catch(e) {}
  }

  function copyShareCard() {
    var text = "🐹 Meet my Chemistry Stuffed Mole: " + name + "!\\n" +
               "Celebrating Mole Day & Avogadro's Number: 1 mol = 6.022 x 10²³ particles!\\n" +
               "#stuffedmole #molechemistry #moleday #chemistryideas #amole #moleproject";
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
        showToastMsg("📋 Copied share card to clipboard!");
      } else {
        showToastMsg("✨ Sharing ready: " + name);
      }
      playBeep("tick");
      triggerConfettiBurst();
      maybeShowInterstitial(false);
    } catch(e) {}
  }

  function downloadCardPNG() {
    playBeep("mole_celebrate");
    triggerConfettiBurst();
    showToastMsg("📥 Generating Stuffed Mole Polaroid Card...");

    try {
      var canvas = document.createElement("canvas");
      canvas.width = 540;
      canvas.height = 680;
      var ctx = canvas.getContext("2d");

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, 540, 680);
      ctx.strokeStyle = "#e0e0e0";
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, 536, 676);

      var bgGrad = ctx.createLinearGradient(30, 30, 510, 510);
      bgGrad.addColorStop(0, "#0d1b2a");
      bgGrad.addColorStop(1, "#1b263b");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(30, 30, 480, 480);

      ctx.strokeStyle = "rgba(0, 230, 118, 0.08)";
      ctx.lineWidth = 1;
      for (var x = 30; x <= 510; x += 30) {
        ctx.beginPath(); ctx.moveTo(x, 30); ctx.lineTo(x, 510); ctx.stroke();
      }
      for (var y = 30; y <= 510; y += 30) {
        ctx.beginPath(); ctx.moveTo(30, y); ctx.lineTo(510, y); ctx.stroke();
      }

      ctx.fillStyle = "#00e676";
      ctx.font = "bold 16px Courier New, monospace";
      ctx.textAlign = "center";
      ctx.fillText("🧪 LAB CRAFT • MOLE MASCOT", 270, 64);

      var svgEl = document.getElementById("mole-mascot-preview-svg");
      var xml = new XMLSerializer().serializeToString(svgEl);
      var svgBlob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
      var URL = window.URL || window.webkitURL || window;
      var blobURL = URL.createObjectURL(svgBlob);
      var img = new Image();
      img.onload = function() {
        ctx.drawImage(img, 135, 120, 270, 270);

        ctx.fillStyle = "rgba(0, 230, 118, 0.2)";
        ctx.strokeStyle = "#00e676";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(110, 440, 320, 36, 18);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px Courier New, monospace";
        ctx.fillText("1 MOLE = 6.022 × 10²³ PARTICLES", 270, 463);

        ctx.fillStyle = "#111827";
        ctx.font = "900 28px Courier New, monospace";
        ctx.fillText("🐹 " + name, 270, 560);

        ctx.fillStyle = "#e91e63";
        ctx.font = "bold 14px sans-serif";
        ctx.fillText("★ PINTEREST TRENDING • CHEMISTRY MOLE DAY ★", 270, 595);

        ctx.fillStyle = "#6b7280";
        ctx.font = "12px Courier New, monospace";
        ctx.fillText("#stuffedmole #molechemistry #moleday #chemistryideas", 270, 630);

        var a = document.createElement("a");
        a.download = "stuffed-mole-" + name.toLowerCase().replace(/[^a-z0-9]/g, "-") + ".png";
        a.href = canvas.toDataURL("image/png");
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobURL);
        setTimeout(function() {
          maybeShowInterstitial(true);
        }, 600);
      };
      img.src = blobURL;
    } catch(err) {
      showToastMsg("✨ Saved Stuffed Mole details!");
    }
  }

  return (
    <div style={{ padding: "10px 14px", maxWidth: 440, margin: "0 auto" }}>
      {toast && (
        <div style={{
          position: "fixed", top: 16, left: "50%", transform: "translateX(-50%)",
          background: "#00e676", color: "#000", fontWeight: 900, fontSize: 13,
          padding: "8px 18px", borderRadius: 20, zIndex: 9999,
          boxShadow: "0 4px 18px rgba(0,230,118,0.5)", animation: "slideDown .3s ease-out"
        }}>
          {toast}
        </div>
      )}

      <div style={{ textAlign: "center", marginBottom: 12 }}>
        <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "rgba(255,64,129,.14)", padding: "3px 10px", borderRadius: 12, border: "1px solid rgba(255,64,129,.35)", marginBottom: 4 }}>
          <span style={{ fontSize: 13 }}>📌</span>
          <span style={{ fontSize: 10, fontWeight: 900, color: "#ff4081", letterSpacing: 1 }}>PINTEREST TRENDING • STUFFED MOLE</span>
        </div>
        <h2 style={{ fontSize: 20, fontWeight: 900, color: isLight ? "#111" : "#fff", margin: 0 }}>
          🧸 STUFFED MOLE STUDIO
        </h2>
        <p style={{ fontSize: 11, color: T.textDim, margin: "3px 0 0" }}>
          Design your custom plush chemistry mole mascot with lab gear, cute costumes, and pun names!
        </p>
      </div>

      <div style={{
        background: isLight ? "#ffffff" : "linear-gradient(180deg,#121626,#0d111e)",
        border: "2px solid " + (isLight ? "#cfd8dc" : "rgba(255,64,129,.3)"),
        borderRadius: 16,
        padding: "16px 12px 14px",
        boxShadow: "0 8px 24px rgba(0,0,0,.25)",
        position: "relative",
        textAlign: "center"
      }}>
        <button
          onClick={randomize}
          title="Randomize Mascot"
          style={{
            position: "absolute", top: 10, right: 10,
            padding: "5px 10px", borderRadius: 14, fontSize: 11, fontWeight: 800,
            background: "linear-gradient(135deg,#ff4081,#7e57c2)", color: "#fff",
            border: "none", cursor: "pointer", fontFamily: "inherit"
          }}
        >
          🎲 Surprise!
        </button>

        <div id="mole-mascot-preview-svg" style={{ margin: "4px auto 0" }}>
          <StuffedMoleSVG fur={fur} costume={costume} eyewear={eyewear} prop={prop} size={185} />
        </div>

        <div style={{ marginTop: 8 }}>
          <div style={{ fontSize: 18, fontWeight: 900, color: isLight ? "#111" : "#00e676" }}>
            {name || "Unnamed Mole"}
          </div>
          <div style={{ fontSize: 10, color: isLight ? "#555" : "#ff4081", fontWeight: 800, letterSpacing: 1, marginTop: 2 }}>
            CHIEF CLASSROOM & LAB MASCOT
          </div>
          <div style={{ display: "inline-block", marginTop: 4, padding: "2px 8px", borderRadius: 10, background: isLight ? "#eef2f7" : "rgba(0,230,118,.1)", border: "1px solid rgba(0,230,118,.3)", fontSize: 10, color: isLight ? "#00897b" : "#00e676", fontWeight: 700 }}>
            1 mol = 6.022 × 10²³ particles
          </div>
        </div>

        <div style={{ display: "flex", gap: 6, marginTop: 12, justifyContent: "center" }}>
          <button
            onClick={downloadCardPNG}
            style={{
              flex: 1.2, padding: "9px 10px", borderRadius: 10,
              background: "linear-gradient(135deg,#00e676,#00b248)",
              border: "none", color: "#000", fontWeight: 900, fontSize: 12,
              cursor: "pointer", fontFamily: "inherit"
            }}
          >
            📥 Download Card (PNG)
          </button>
          <button
            onClick={copyShareCard}
            style={{
              flex: 1, padding: "9px 8px", borderRadius: 10,
              background: isLight ? "#f0f4f8" : "rgba(255,255,255,.06)",
              border: "1px solid " + T.borderSoft, color: T.text, fontWeight: 800, fontSize: 12,
              cursor: "pointer", fontFamily: "inherit"

/* ─── TAB 2: MOLE DRAWING STUDIO ─── */
function MoleDrawingStudio(props) {
  var T = props.T;
  var isLight = T.isLight;
  var canvasRef = useRef(null);
  var [color, setColor] = useState("#00e676");
  var [lineWidth, setLineWidth] = useState(6);
  var [isDrawing, setIsDrawing] = useState(false);
  var [savedDrawings, setSavedDrawings] = useState(function() {
    try {
      var s = localStorage.getItem("labcraft_mole_drawings");
      return s ? JSON.parse(s) : [];
    } catch(e) { return []; }
  });
  var [activeStep, setActiveStep] = useState(0);

  var COLORS = [
    { hex: "#00e676", label: "Neon Green" },
    { hex: "#00e5ff", label: "Cyan Electric" },
    { hex: "#ff4081", label: "Hot Pink" },
    { hex: "#ffd700", label: "Amber Gold" },
    { hex: "#b388ff", label: "Cosmic Purple" },
    { hex: "#ffffff", label: "Pure White" },
    { hex: "#6d4c41", label: "Mole Fur Brown" },
    { hex: "eraser",  label: "🧽 Eraser" }
  ];

  var STEPS = [
    {
      num: 1,
      title: "Step 1: Soft Pear Body",
      tip: "Draw a curved egg or pear shape for the chubby stuffed mole body. Keep the bottom wider than the top!",
      svg: (
        <svg width="60" height="60" viewBox="0 0 100 100">
          <ellipse cx="50" cy="58" rx="32" ry="34" fill="none" stroke="#00e676" strokeWidth="3" strokeDasharray="4,4" />
          <ellipse cx="50" cy="40" rx="24" ry="20" fill="none" stroke="#00e676" strokeWidth="3" strokeDasharray="4,4" />
        </svg>
      )
    },
    {
      num: 2,
      title: "Step 2: Snout, Nose & Whiskers",
      tip: "Add a soft oval snout in the center, a dark button nose on top, and 3 gentle whisker lines on each side!",
      svg: (
        <svg width="60" height="60" viewBox="0 0 100 100">
          <ellipse cx="50" cy="50" rx="16" ry="11" fill="none" stroke="#ff4081" strokeWidth="2.5" />
          <ellipse cx="50" cy="45" rx="7" ry="5" fill="#ff4081" />
          <line x1="32" y1="48" x2="16" y2="46" stroke="#ff4081" strokeWidth="2" />
          <line x1="32" y1="52" x2="14" y2="52" stroke="#ff4081" strokeWidth="2" />
          <line x1="68" y1="48" x2="84" y2="46" stroke="#ff4081" strokeWidth="2" />
          <line x1="68" y1="52" x2="86" y2="52" stroke="#ff4081" strokeWidth="2" />
        </svg>
      )
    },
    {
      num: 3,
      title: "Step 3: Lab Safety Goggles",
      tip: "Draw two giant connected circles around the eyes with a headband strap. Real chemistry safety first!",
      svg: (
        <svg width="60" height="60" viewBox="0 0 100 100">
          <circle cx="36" cy="46" r="13" fill="none" stroke="#00e5ff" strokeWidth="3" />
          <circle cx="64" cy="46" r="13" fill="none" stroke="#00e5ff" strokeWidth="3" />
          <line x1="49" y1="46" x2="51" y2="46" stroke="#00e5ff" strokeWidth="3" />
          <path d="M 23 46 L 10 46 M 77 46 L 90 46" stroke="#00e5ff" strokeWidth="2.5" />
        </svg>
      )
    },
    {
      num: 4,
      title: "Step 4: Lab Coat & Bubbling Flask",
      tip: "Add a crisp V-neck lab coat with collar flaps, and sketch a bubbling conical flask in one furry paw!",
      svg: (
        <svg width="60" height="60" viewBox="0 0 100 100">
          <path d="M 30 35 L 42 55 L 34 75 M 70 35 L 58 55 L 66 75" fill="none" stroke="#ffd700" strokeWidth="2.5" />
          <path d="M 72 50 L 82 72 L 62 72 Z" fill="none" stroke="#00e676" strokeWidth="2" />
          <circle cx="72" cy="62" r="2" fill="#00e676" />
        </svg>
      )
    }
  ];

  useEffect(function() {
    var cv = canvasRef.current;
    if (!cv) return;
    var ctx = cv.getContext("2d");
    ctx.fillStyle = isLight ? "#ffffff" : "#0d111e";
    ctx.fillRect(0, 0, cv.width, cv.height);
    loadStencil();
  }, []);

  function getPos(e) {
    var cv = canvasRef.current;
    var rect = cv.getBoundingClientRect();
    var clientX, clientY;
    if (e.touches && e.touches[0]) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    var scaleX = cv.width / rect.width;
    var scaleY = cv.height / rect.height;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  function startDraw(e) {
    if (e.cancelable) e.preventDefault();
    setIsDrawing(true);
    var p = getPos(e);
    var cv = canvasRef.current;
    var ctx = cv.getContext("2d");
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }

  function doDraw(e) {
    if (!isDrawing) return;
    if (e.cancelable) e.preventDefault();
    var p = getPos(e);
    var cv = canvasRef.current;
    var ctx = cv.getContext("2d");
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = lineWidth;
    if (color === "eraser") {
      ctx.strokeStyle = isLight ? "#ffffff" : "#0d111e";
    } else {
      ctx.strokeStyle = color;
    }
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  function endDraw() {
    setIsDrawing(false);
  }

  function clearCanvas() {
    var cv = canvasRef.current;
    if (!cv) return;
    var ctx = cv.getContext("2d");
    ctx.fillStyle = isLight ? "#ffffff" : "#0d111e";
    ctx.fillRect(0, 0, cv.width, cv.height);
    playBeep("tick");
  }

  function loadStencil() {
    var cv = canvasRef.current;
    if (!cv) return;
    var ctx = cv.getContext("2d");
    ctx.save();
    ctx.strokeStyle = isLight ? "rgba(0,0,0,0.12)" : "rgba(255,255,255,0.15)";
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);

    // Head & Body Stencil
    ctx.beginPath();
    ctx.ellipse(160, 150, 60, 68, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(160, 95, 45, 40, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Ears
    ctx.beginPath();
    ctx.arc(115, 75, 14, 0, Math.PI * 2);
    ctx.arc(205, 75, 14, 0, Math.PI * 2);
    ctx.stroke();

    // Snout
    ctx.beginPath();
    ctx.ellipse(160, 105, 20, 14, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Goggles
    ctx.beginPath();
    ctx.arc(140, 90, 14, 0, Math.PI * 2);
    ctx.arc(180, 90, 14, 0, Math.PI * 2);
    ctx.stroke();

    // Flask
    ctx.beginPath();
    ctx.moveTo(215, 140); ctx.lineTo(235, 175); ctx.lineTo(195, 175); ctx.closePath();
    ctx.stroke();

    ctx.restore();
    playBeep("tick");
  }

  function saveDrawing() {
    var cv = canvasRef.current;
    if (!cv) return;
    var url = cv.toDataURL("image/png");
    var updated = [url].concat(savedDrawings).slice(0, 6);
    setSavedDrawings(updated);
    try {
      localStorage.setItem("labcraft_mole_drawings", JSON.stringify(updated));
    } catch(e) {}
    playBeep("mole_celebrate");
    triggerConfettiBurst();
    maybeShowInterstitial(false);
  }

  function downloadUserDrawing(url) {
    var a = document.createElement("a");
    a.download = "my-mole-drawing.png";
    a.href = url;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() {
      maybeShowInterstitial(true);
    }, 500);
  }

  function deleteDrawing(idx) {
    var updated = savedDrawings.filter(function(_, i) { return i !== idx; });
    setSavedDrawings(updated);
    try {
      localStorage.setItem("labcraft_mole_drawings", JSON.stringify(updated));
    } catch(e) {}
    playBeep("tick");
  }

  return (
    <div style={{ padding: "10px 14px", maxWidth: 440, margin: "0 auto" }}>
      <div style={{ textAlign: "center", marginBottom: 12 }}>
        <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "rgba(0,230,118,.12)", padding: "3px 10px", borderRadius: 12, border: "1px solid rgba(0,230,118,.35)", marginBottom: 4 }}>
          <span style={{ fontSize: 13 }}>✏️</span>
          <span style={{ fontSize: 10, fontWeight: 900, color: "#00e676", letterSpacing: 1 }}>PINTEREST TRENDING • MOLE DRAWING</span>
        </div>
        <h2 style={{ fontSize: 20, fontWeight: 900, color: isLight ? "#111" : "#fff", margin: 0 }}>
          🎨 MOLE DRAWING STUDIO
        </h2>
        <p style={{ fontSize: 11, color: T.textDim, margin: "3px 0 0" }}>
          Learn step-by-step how to draw a cute stuffed chemistry mole or sketch your own on the neon canvas!
        </p>
      </div>

      {/* Step by Step Drawing Guide Carousel */}
      <div style={{ background: T.surfaceAlt, border: "1px solid " + T.borderSoft, borderRadius: 12, padding: "10px 12px", marginBottom: 12 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <span style={{ fontSize: 12, fontWeight: 900, color: "#00e676" }}>
            HOW TO DRAW A MOLE (STEP {STEPS[activeStep].num} / 4)
          </span>
          <div style={{ display: "flex", gap: 4 }}>
            {STEPS.map(function(s, idx) {
              return (
                <button
                  key={s.num}
                  onClick={function() { setActiveStep(idx); playBeep("tick"); }}
                  style={{
                    width: 22, height: 22, borderRadius: "50%", border: "none",
                    background: activeStep === idx ? "#00e676" : T.surfaceAlt,
                    color: activeStep === idx ? "#000" : T.textDim,
                    fontWeight: 900, fontSize: 10, cursor: "pointer"
                  }}
                >
                  {s.num}
                </button>
              );
            })}
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ background: isLight ? "#fff" : "rgba(0,0,0,0.3)", borderRadius: 8, padding: 4, flexShrink: 0 }}>
            {STEPS[activeStep].svg}
          </div>
          <div>
            <div style={{ fontSize: 13, fontWeight: 800, color: isLight ? "#111" : "#fff" }}>
              {STEPS[activeStep].title}
            </div>
            <div style={{ fontSize: 11, color: T.textDim, marginTop: 2, lineHeight: 1.35 }}>
              {STEPS[activeStep].tip}
            </div>
          </div>
        </div>
      </div>

      {/* Interactive Touch/Mouse Canvas */}
      <div style={{
        background: isLight ? "#ffffff" : "#0d111e",
        border: "2px solid " + (isLight ? "#cfd8dc" : "rgba(0,230,118,0.4)"),
        borderRadius: 14, overflow: "hidden",
        boxShadow: "0 6px 20px rgba(0,0,0,.25)",
        textAlign: "center"
      }}>
        <canvas
          ref={canvasRef}
          width={320}
          height={240}
          onMouseDown={startDraw}
          onMouseMove={doDraw}
          onMouseUp={endDraw}
          onMouseLeave={endDraw}
          onTouchStart={startDraw}
          onTouchMove={doDraw}
          onTouchEnd={endDraw}
          style={{ display: "block", margin: "0 auto", width: "100%", maxWidth: 320, height: 240, touchAction: "none", cursor: "crosshair" }}
        />
      </div>

      {/* Palette & Brush Controls */}
      <div style={{ marginTop: 10 }}>
        {/* Colors */}
        <div style={{ display: "flex", gap: 6, justifyContent: "center", flexWrap: "wrap", marginBottom: 8 }}>
          {COLORS.map(function(col) {
            var on = color === col.hex;
            return (
              <button
                key={col.hex}
                onClick={function() { setColor(col.hex); playBeep("tick"); }}
                title={col.label}
                style={{
                  width: 28, height: 28, borderRadius: "50%",
                  background: col.hex === "eraser" ? "#37474f" : col.hex,
                  border: on ? "2.5px solid #fff" : "1px solid rgba(0,0,0,0.3)",
                  boxShadow: on ? "0 0 8px #00e676" : "none",
                  cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
                  fontSize: 12, color: "#fff"
                }}
              >
                {col.hex === "eraser" ? "🧽" : ""}
              </button>
            );
          })}
        </div>

        {/* Thickness */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, background: T.surfaceAlt, padding: "6px 12px", borderRadius: 10, border: "1px solid " + T.borderSoft }}>

          <div style={{ display: "flex", gap: 8 }}>
            {[3, 6, 12].map(function(w) {
              return (
                <button
                  key={w}
                  onClick={function() { setLineWidth(w); playBeep("tick"); }}
                  style={{
                    padding: "3px 10px", borderRadius: 6, fontSize: 10, fontWeight: 800,
                    background: lineWidth === w ? "#00e676" : "transparent",
                    color: lineWidth === w ? "#000" : T.textDim,
                    border: "1px solid " + (lineWidth === w ? "#00e676" : T.borderSoft),
                    cursor: "pointer"
                  }}
                >
                  {w === 3 ? "Fine" : w === 6 ? "Medium" : "Bold"}
                </button>
              );
            })}
          </div>
        </div>

        {/* Canvas Actions */}
        <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
          <button
            onClick={loadStencil}
            style={{
              flex: 1, padding: "8px", borderRadius: 8, fontSize: 11, fontWeight: 800,

            }}

            📋 Trace Stencil
          </button>
          <button
            onClick={clearCanvas}
            style={{
              flex: 1, padding: "8px", borderRadius: 8, fontSize: 11, fontWeight: 800,
              background: "rgba(255,80,80,.1)", border: "1px solid rgba(255,80,80,.3)", color: "#ef5350",
              cursor: "pointer", fontFamily: "inherit"

          >
            🗑️ Clear

          <button

              flex: 1.4, padding: "8px", borderRadius: 8, fontSize: 11, fontWeight: 900,

              cursor: "pointer", fontFamily: "inherit"

        </div>

      {/* Saved Gallery */}

            {savedDrawings.map(function(url, idx) {
              return (
                <div key={idx} style={{ position: "relative", background: isLight ? "#fff" : "#0d111e", border: "1px solid " + T.borderSoft, borderRadius: 8, overflow: "hidden" }}>
                  <img src={url} alt="Mole drawing" style={{ width: "100%", height: 80, objectFit: "contain", display: "block" }} />

          </div>
          <input

            onChange={function(e) { setMoles(parseFloat(e.target.value) / currentMolarMass); }}

        </div>

            = {(moles * 602200000000000000000000).toExponential(3)} individual atoms/molecules

        </div>

        {/* 4. Gas Volume at STP */}
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, fontWeight: 800, marginBottom: 3 }}>
            <span style={{ color: "#ffd700" }}>STP Gas Volume (V = n × 22.4 L):</span>

        </div>
      </div>

          💡 HOW BIG IS A MOLE? (MIND-BLOWING FACTS)

          {COMPARISONS.map(function(item, idx) {

                  </div>

                    {item.desc}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ─── TAB 5: MOLE DAY PARTY & COUNTDOWN ─── */
function MoleDayPartyView(props) {
  var T = props.T;
  var isLight = T.isLight;
  var [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
  var [celebrated, setCelebrated] = useState(function() {
    try { return !!localStorage.getItem("labcraft_mole_celebrated"); } catch(e) { return false; }
  });

  useEffect(function() {
    function calcTime() {
      var now = new Date();
      var year = now.getFullYear();
      var target = new Date(year, 9, 23, 6, 2, 0); // Oct is month index 9
      if (now.getTime() > target.getTime()) {
        target = new Date(year + 1, 9, 23, 6, 2, 0);
      }
      var diff = Math.max(0, target.getTime() - now.getTime());
      var d = Math.floor(diff / (1000 * 60 * 60 * 24));
      var h = Math.floor((diff / (1000 * 60 * 60)) % 24);
      var m = Math.floor((diff / (1000 * 60)) % 60);
      var s = Math.floor((diff / 1000) % 60);
      setTimeLeft({ days: d, hours: h, minutes: m, seconds: s });
    }
    calcTime();
    var timer = setInterval(calcTime, 1000);
    return function() { clearInterval(timer); };
  }, []);

  function handleCelebrate() {
    playBeep("mole_celebrate");
    triggerConfettiBurst();
    setCelebrated(true);
    try {
      localStorage.setItem("labcraft_mole_celebrated", "true");
    } catch(e) {}
    setTimeout(function() {
      maybeShowInterstitial(true);
    }, 700);
  }

  return (
    <div style={{ padding: "10px 14px", maxWidth: 440, margin: "0 auto", textAlign: "center" }}>
      <div style={{ marginBottom: 12 }}>
        <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "rgba(255,215,0,.14)", padding: "3px 10px", borderRadius: 12, border: "1px solid rgba(255,215,0,.35)", marginBottom: 4 }}>
